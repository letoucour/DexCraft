<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DexCraft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --r6:#ff4fd8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#eef0fa; --surface:#ffffff; --surface-2:#e3e6f5; --ink:#1c2042; --ink-soft:#5b6088;
  --line:#cfd3ea; --gold:#e0a800; --gold-ink:#3a2a00; --danger:#c8324b; --ok:#1f8a4c;
  --r0:#8a8fa8; --r1:#2f9e5b; --r2:#2f7fe0; --r3:#9a4fe6; --r4:#0f9c94; --r5:#d99a00;
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#161a33; --surface:#20264a; --surface-2:#2a3160; --ink:#f1f0ff; --ink-soft:#a7abd3;
    --line:#363e72; --gold:#ffcf3f; --gold-ink:#2b1f00; --danger:#ff6b81; --ok:#5fd68f;
    --r0:#a4a9c6; --r1:#5fd68f; --r2:#6fb0ff; --r3:#c38bff; --r4:#3ee3d6; --r5:#ffcf3f;
  }
}
:root[data-theme="dark"]{
  --bg:#161a33; --surface:#20264a; --surface-2:#2a3160; --ink:#f1f0ff; --ink-soft:#a7abd3;
  --line:#363e72; --gold:#ffcf3f; --gold-ink:#2b1f00; --danger:#ff6b81; --ok:#5fd68f;
  --r0:#a4a9c6; --r1:#5fd68f; --r2:#6fb0ff; --r3:#c38bff; --r4:#3ee3d6; --r5:#ffcf3f;
}
html{overflow-x:clip;height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* Header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:6px 12px;flex-wrap:nowrap}
.brand{font-family:var(--display);font-weight:700;font-size:1.2rem;flex:0 0 auto;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand .gem{color:var(--gold);font-size:1.1rem}
nav.tabs{display:flex;gap:2px;flex-wrap:nowrap;justify-content:center;flex:1 1 auto;min-width:0}
nav.tabs button{background:none;border:0;padding:6px 8px;font-size:.88rem;flex:0 0 auto;border-radius:10px;font-weight:700;color:var(--ink-soft);white-space:nowrap}
nav.tabs button[aria-current="page"]{background:var(--surface-2);color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:nowrap;justify-content:flex-end;flex:0 0 auto}
.chip{display:flex;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-weight:700;font-size:.85rem;white-space:nowrap}
.chip b{font-family:var(--display);font-size:1.05rem}
.chip .gold{color:var(--gold)}

main{max-width:1280px;margin:0 auto;padding:14px 16px 60px}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.15;margin:0}
h1{font-size:clamp(1.6rem,3.2vw,2.2rem);letter-spacing:-.02em}
h2{font-size:1.5rem}
h3{font-size:1.1rem}
.muted{color:var(--ink-soft)}
.btn{border:0;border-radius:12px;padding:10px 18px;font-weight:700;background:var(--surface-2);color:var(--ink)}
.btn.primary{background:var(--gold);color:var(--gold-ink)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{padding:6px 12px;font-size:.9rem;border-radius:10px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.notice{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:14px 16px;color:var(--ink-soft)}

/* Booster screen */
.booster{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding-top:4px}
.booster p{margin:0}
.booster details{max-width:560px;text-align:left}
.booster summary{cursor:pointer;color:var(--gold);font-weight:700;text-align:center;list-style:none}
.booster summary::-webkit-details-marker{display:none}
.rules{margin-top:10px;font-size:.95rem}
.rules table{border-collapse:collapse;width:100%;margin:8px 0}
.rules td{padding:4px 8px;border-bottom:1px solid var(--line)}
.rules td:last-child{text-align:right;font-weight:700}

.pack-wrap{margin:10px 0 2px;perspective:900px}
.pack-hit{display:block;border:0;padding:0;background:none;width:clamp(120px,22vh,180px);aspect-ratio:190/270;height:auto;border-radius:12px;-webkit-tap-highlight-color:transparent}
.pack-hit:disabled{cursor:not-allowed}
.pack-hit *{pointer-events:none}
.pack{position:relative;width:100%;height:100%;transition:transform .25s ease}
.pack-hit:not(:disabled):hover .pack{transform:translateY(-6px) rotate(-2deg)}
.pack-hit:not(:disabled):active .pack{transform:scale(.97)}
.pack-hit:disabled .pack{filter:grayscale(.85) brightness(.75)}
.pack-body{position:absolute;inset:0;
  background:
    repeating-linear-gradient(135deg,rgba(255,255,255,.18) 0 2px,transparent 2px 14px),
    linear-gradient(160deg,#ffe27a 0%,#f2a900 38%,#e7621e 72%,#a5307a 100%);
  -webkit-mask:
    conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) top/12px 60% repeat-x,
    conic-gradient(from 135deg at top,#0000,#000 1deg 89deg,#0000 90deg) bottom/12px 60% repeat-x;
          mask:
    conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) top/12px 60% repeat-x,
    conic-gradient(from 135deg at top,#0000,#000 1deg 89deg,#0000 90deg) bottom/12px 60% repeat-x;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.1);
}
.pack-body{-webkit-mask:none!important;mask:none!important;border-radius:4px}
.pack::before,.pack::after{content:"";position:absolute;left:-2px;right:-2px;height:14px;z-index:2;border-radius:3px;
  background:repeating-linear-gradient(90deg,rgba(60,25,0,.28) 0 2px,transparent 2px 6px),linear-gradient(#ffe9a0,#e9b43a);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.pack::before{top:-4px}.pack::after{bottom:-4px;background:repeating-linear-gradient(90deg,rgba(60,25,0,.28) 0 2px,transparent 2px 6px),linear-gradient(#c9559a,#a5307a)}
.pack-emblem{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#2b1400}
.pack-emblem .diamond{width:92px;height:92px;transform:rotate(45deg);background:#fff8e0;border:5px solid #2b1400;display:flex;align-items:center;justify-content:center;box-shadow:6px 6px 0 rgba(43,20,0,.25)}
.pack-emblem .diamond span{transform:rotate(-45deg);font-family:var(--display);font-weight:700;font-size:1.7rem;letter-spacing:-.03em}
.pack-emblem .pk-name{margin-top:26px;font-family:var(--display);font-weight:700;font-size:1.25rem;letter-spacing:-.01em}
.pack-emblem small{font-family:var(--display);font-weight:600;font-size:.95rem;letter-spacing:.02em}
.pack-shadow{width:150px;height:18px;margin:10px auto 0;border-radius:50%;background:radial-gradient(rgba(0,0,0,.35),transparent 70%)}
.pack.tear .pack-body,.pack.tear .pack-emblem,.pack.tear::before,.pack.tear::after{animation:tear .55s ease-in forwards}
@keyframes tear{40%{transform:scale(1.06) rotate(3deg)}100%{transform:scale(.6) translateY(-40px);opacity:0}}

.stock{display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:6px}
.stock .big{font-family:var(--display);font-weight:700;font-size:2rem;line-height:1}
.stock .big .of{color:var(--ink-soft);font-size:1.3rem}
.stock-bar{display:flex;gap:4px;margin:6px 0}
.stock-bar i{width:14px;height:20px;border-radius:3px;background:var(--surface-2);border:1px solid var(--line)}
.stock-bar i.on{background:var(--gold);border-color:var(--gold)}

/* Reveal */
.hand-wrap{position:relative;width:100vw;flex:0 0 auto;align-self:center}
.hand{--ch:clamp(230px,calc(100dvh - 345px),400px);--cw:calc(var(--ch)*5/7);position:relative;display:flex;align-items:center;overflow-x:auto;overflow-y:hidden;
  scroll-snap-type:x mandatory;padding:30px calc(50% - var(--cw)/2) 44px;scrollbar-width:none;cursor:grab;overscroll-behavior-x:contain;-webkit-user-select:none;user-select:none;touch-action:pan-x}
.hand::-webkit-scrollbar{display:none}
.hand.dragging{cursor:grabbing;scroll-snap-type:none}
.hand .flip{flex:0 0 var(--cw);width:var(--cw);height:var(--ch);margin:0 calc(var(--cw)*-.1);scroll-snap-align:center;transform-origin:50% 120%;transition:transform .18s ease-out;will-change:transform}
.hand .flip .card{font-size:clamp(14px,calc(var(--cw)/15),18px)}
.hand .flip.current{filter:drop-shadow(0 14px 22px rgba(0,0,0,.35))}
.hand-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:150;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:1.3rem;font-weight:700;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.hand-nav:disabled{opacity:.3}
.hand-nav.prev{left:max(12px,calc(50% - 640px))}.hand-nav.next{right:max(12px,calc(50% - 640px))}
.hand-count{font-weight:700;font-size:.9rem;color:var(--ink-soft);margin-top:-30px;position:relative;z-index:2}
.reveal-bar{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px 14px;min-height:40px}
@media (max-width:560px){.hand-nav{display:none}}
.recap{margin-top:18px;text-align:left;max-width:1180px;margin-left:auto;margin-right:auto;padding:0 4px}
.recap-grid{align-items:stretch}
.recap-item{position:relative;display:flex}
.recap-item .mini{width:100%;height:100%}
.recap-item .mini .mi{flex:1;display:flex;flex-direction:column;justify-content:space-between}
.recap-item .new-tag{top:-8px;right:-6px;font-size:.7rem;padding:1px 8px}
.open-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.reveal-sum{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 16px;font-weight:700;font-size:.95rem}
.new-sum{color:var(--gold)}
.reveal.multi{gap:12px}
.reveal.multi .flip{width:min(172px,30vw)}
.reveal.multi .card{font-size:14px;padding:6px 7px}
.reveal.multi .card-name{font-size:1.05rem}
.reveal.multi .art-no{font-size:3.6rem}
.reveal.multi .stats{font-size:.56rem;gap:1px 3px}
@media (max-width:560px){.reveal.multi .flip{width:44vw}}
.reveal{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;margin-top:24px}
.flip{width:min(210px,44vw);aspect-ratio:5/7;perspective:1000px;border:0;padding:0;background:none}
.flip-in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,1.4,.5,1)}
.flip.shown .flip-in{transform:rotateY(180deg)}
.flip .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flip .front{transform:rotateY(180deg)}
.back{border-radius:14px;background:
  radial-gradient(circle at 50% 44%,rgba(255,207,63,.18),transparent 45%),
  repeating-linear-gradient(45deg,#2a3170 0 10px,#232964 10px 20px);
  border:6px solid #f2f0ff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16%;
  font-family:var(--display);font-weight:700;color:#ffcf3f;box-shadow:0 8px 20px rgba(0,0,0,.25);container-type:inline-size}
.bk-gem{width:34%;aspect-ratio:1;transform:rotate(45deg);border:4px solid #ffcf3f;border-radius:6px;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.18);box-shadow:0 0 0 4px rgba(255,207,63,.25)}
.bk-gem b{transform:rotate(-45deg);font-size:clamp(14px,13cqw,30px);letter-spacing:-.02em}
.bk-name{font-size:clamp(13px,12cqw,28px);letter-spacing:.01em;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.flip.hint3:not(.shown) .back{animation:aura3 1.6s ease-in-out infinite}
.flip.hint5:not(.shown) .back{animation:aura5 1.1s ease-in-out infinite,tremble .5s linear infinite}
@keyframes aura3{0%,100%{box-shadow:0 0 0 rgba(180,108,255,0)}50%{box-shadow:0 0 28px 6px rgba(180,108,255,.85)}}
@keyframes aura5{0%,100%{box-shadow:0 0 10px 2px rgba(255,207,63,.5)}50%{box-shadow:0 0 42px 12px rgba(255,207,63,1)}}
@keyframes tremble{0%,100%{transform:translate(0,0)}25%{transform:translate(-1px,1px) rotate(-.6deg)}75%{transform:translate(1px,-1px) rotate(.6deg)}}

/* Épique : onde violette et étincelles */
.fx-layer{position:fixed;inset:0;pointer-events:none;z-index:500;overflow:hidden}
.fx-flash{--fc:rgba(180,108,255,.7);position:fixed;inset:0;pointer-events:none;z-index:499;background:radial-gradient(circle at var(--x) var(--y),var(--fc),transparent 60%);animation:flash var(--fd,1.1s) ease-out forwards}
.fx-layer.mega .fx-rays{background:repeating-conic-gradient(from 0deg,rgba(120,255,240,.5) 0 5deg,transparent 5deg 20deg)}
.fx-layer.mega .fx-ring{border-color:#7ef3ea;box-shadow:0 0 20px #2fd4c9,inset 0 0 20px #2fd4c9}
.fx-layer.mega .fx-spark{background:#d8fffb;filter:drop-shadow(0 0 4px #2fd4c9)}
.fx-layer.mega .fx-glint{--gc:rgba(210,255,250,.95)!important;--gb:#2fd4c9!important}
.fx-rays{position:fixed;width:900px;height:900px;margin:-450px 0 0 -450px;border-radius:50%;pointer-events:none;
  background:repeating-conic-gradient(from 0deg,rgba(200,150,255,.55) 0 5deg,transparent 5deg 20deg);
  -webkit-mask:radial-gradient(circle,#000 0,transparent 60%);mask:radial-gradient(circle,#000 0,transparent 60%);animation:rays 1.3s ease-out forwards}
@keyframes rays{0%{transform:scale(.2) rotate(0);opacity:0}25%{opacity:1}100%{transform:scale(1.1) rotate(40deg);opacity:0}}
.mini-shake{animation:mshake .35s linear}
@keyframes mshake{0%,100%{transform:translate(0)}25%{transform:translate(-4px,2px)}50%{transform:translate(4px,-2px)}75%{transform:translate(-2px,-2px)}}
@keyframes flash{from{opacity:1}to{opacity:0}}
.fx-ring{position:fixed;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;border:4px solid #c38bff;box-shadow:0 0 20px #b46cff,inset 0 0 20px #b46cff;animation:ring .9s ease-out forwards}
.fx-ring.r2{border-color:#fff;animation-delay:.12s;opacity:0}
@keyframes ring{0%{transform:scale(.3);opacity:1}100%{transform:scale(13);opacity:0}}
.fx-ring.r3{border-color:#e5ccff;animation-delay:.26s;opacity:0}
.fx-spark{position:fixed;width:10px;height:10px;margin:-5px 0 0 -5px;background:#e5ccff;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);
  filter:drop-shadow(0 0 4px #b46cff);animation:spark 1s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes spark{0%{transform:translate(0,0) scale(.4) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.4) rotate(180deg);opacity:0}}
.card.pop3{animation:pop3 .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop3{0%{transform:scale(1)}30%{transform:scale(1.18) rotate(-3deg)}55%{transform:scale(.97) rotate(1deg)}100%{transform:scale(1)}}

/* Peu commune et Rare : effets légers */
.fx-glint{position:fixed;pointer-events:none;z-index:501;border-radius:14px;overflow:hidden}
.fx-glint::after{content:"";position:absolute;inset:-20%;background:linear-gradient(110deg,transparent 35%,var(--gc) 50%,transparent 65%);transform:translateX(-120%);animation:glint var(--gd,.7s) ease-out forwards}
@keyframes glint{to{transform:translateX(120%)}}
.fx-ring.small{border-width:4px;animation:ringS .8s ease-out forwards}
.fx-ring.small.late{animation-delay:.15s;opacity:0}
@keyframes ringS{0%{transform:scale(.4);opacity:.9}100%{transform:scale(var(--rs,3));opacity:0}}
.fx-spark.s{width:8px;height:8px;margin:-4px 0 0 -4px;animation-duration:.75s}
.card.pop2{animation:pop2 .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop2{0%{transform:scale(1)}40%{transform:scale(var(--ps,1.08))}100%{transform:scale(1)}}
.fx-glint.strong::before{content:"";position:absolute;inset:0;border-radius:14px;box-shadow:inset 0 0 0 4px var(--gb),0 0 30px var(--gb);animation:flash .9s ease-out forwards}

/* Transcendante : scène plein écran, encore au-dessus du mythique */
.legend.trans{background:#02030a}
.legend.trans .t-sky{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(120,150,200,.35),transparent 55%),#02030a;opacity:0;animation:mbg 1.4s 1.6s ease-out forwards}
.legend.trans .t-pillar{position:absolute;left:50%;top:-20vh;width:min(46vw,520px);height:160vh;margin-left:min(-23vw,-260px);opacity:0;
  background:linear-gradient(to bottom,rgba(255,255,255,0),rgba(235,242,255,.85) 35%,rgba(255,255,255,.95) 55%,rgba(200,215,245,.5) 80%,transparent);
  filter:blur(6px);mix-blend-mode:screen;animation:pillar 2.4s 1.2s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes pillar{0%{opacity:0;transform:scaleX(.05)}25%{opacity:1;transform:scaleX(1.25)}100%{opacity:.55;transform:scaleX(1)}}
.legend.trans .rays{background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.34) 0 3deg,transparent 3deg 12deg,rgba(170,190,225,.3) 12deg 15deg,transparent 15deg 26deg);
  opacity:0;animation:beamIn .7s 1.9s forwards,spin 22s linear infinite}
.legend.trans .t-shock{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;border:6px solid #fff;
  box-shadow:0 0 60px 20px rgba(200,220,255,.9),inset 0 0 40px rgba(255,255,255,.8);opacity:0;animation:shock 1.6s 1.75s cubic-bezier(.1,.8,.2,1) forwards}
.legend.trans .t-shock.s2{animation-delay:2.05s;border-width:3px}
@keyframes shock{0%{transform:scale(.2);opacity:1}100%{transform:scale(26);opacity:0}}
.legend.trans .m-flash{animation:mflash 1.6s 1.7s ease-out forwards}
.legend.trans .lg-title{font-size:clamp(2rem,8.5vw,5.2rem);letter-spacing:.02em;
  background:linear-gradient(100deg,#ffffff,#aeb8c9 20%,#ffffff 38%,#7f8798 52%,#ffffff 70%,#c8d2e2 85%,#ffffff);background-size:280% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 26px rgba(210,230,255,.85));
  animation:tTitle 1.1s 1.95s cubic-bezier(.25,1.5,.4,1) both,shine 2.6s 2.6s linear infinite}
@keyframes tTitle{0%{transform:scale(3.4) rotate(-6deg);opacity:0;filter:blur(14px)}60%{opacity:1}100%{transform:scale(1) rotate(0);opacity:1;filter:blur(0)}}
.legend.trans .lg-card{width:min(300px,72vw);animation:tCard 2.2s 1.7s cubic-bezier(.2,.85,.25,1) both;filter:drop-shadow(0 0 34px rgba(255,255,255,.9)) drop-shadow(0 0 70px rgba(150,190,255,.7))}
@keyframes tCard{0%{transform:perspective(1200px) translateY(-60vh) rotateX(80deg) rotateZ(160deg) scale(.15);opacity:0}45%{opacity:1}100%{transform:perspective(1200px) translateY(0) rotateX(0) rotateZ(0) scale(1)}}
.legend.trans .lg-name{animation:lgIn .7s 3.3s both;color:#eef3ff;text-shadow:0 0 16px rgba(180,210,255,.9)}
.legend.trans .lg-sub{animation:lgIn .6s 4s both;color:#c8d3e8}
/* Légendaire : scène plein écran */
.legend{position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  background:radial-gradient(circle,rgba(60,40,0,.85),rgba(8,8,20,.96) 70%);animation:lgIn .4s ease-out;padding:20px;cursor:pointer}
@keyframes lgIn{from{opacity:0}to{opacity:1}}
.legend .rays{position:absolute;left:50%;top:50%;width:260vmax;height:260vmax;margin:-130vmax 0 0 -130vmax;
  background:repeating-conic-gradient(from 0deg,rgba(255,207,63,.28) 0 6deg,transparent 6deg 18deg);
  -webkit-mask:radial-gradient(circle,#000 0,transparent 32%);mask:radial-gradient(circle,#000 0,transparent 32%);animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.legend canvas{position:absolute;inset:0;width:100%;height:100%}
.legend .lg-title{position:relative;font-family:var(--display);font-weight:700;font-size:clamp(2.4rem,9vw,4.6rem);letter-spacing:-.02em;line-height:1;
  background:linear-gradient(100deg,#fff4c2 0%,#ffcf3f 30%,#fff 50%,#ffb000 70%,#fff4c2 100%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 18px rgba(255,190,40,.7));animation:titleIn .7s .35s cubic-bezier(.3,1.6,.5,1) both,shine 2.4s 1s linear infinite}
@keyframes titleIn{from{transform:scale(2.4);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes shine{from{background-position:120% 0}to{background-position:-120% 0}}
.legend .lg-card{position:relative;width:min(280px,70vw);animation:cardIn 1.3s cubic-bezier(.2,.9,.3,1) both;filter:drop-shadow(0 0 30px rgba(255,207,63,.9))}
@keyframes cardIn{0%{transform:perspective(900px) translateY(40vh) rotateY(900deg) scale(.2);opacity:0}70%{opacity:1}100%{transform:perspective(900px) translateY(0) rotateY(0) scale(1)}}
.legend .lg-sub{position:relative;color:#fff4c2;font-weight:700;animation:lgIn .5s 1.4s both}
.shake{animation:shake .5s linear}
@keyframes shake{0%,100%{transform:translate(0)}20%{transform:translate(-8px,4px)}40%{transform:translate(7px,-5px)}60%{transform:translate(-5px,-3px)}80%{transform:translate(4px,5px)}}
.new-tag{position:absolute;top:-10px;right:-8px;z-index:3;background:var(--gold);color:var(--gold-ink);font-weight:700;font-size:.8rem;padding:2px 10px;border-radius:999px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.reveal-actions{display:flex;gap:10px;justify-content:center;margin-top:20px}

/* Card */
.card{--c1:#999;--c2:#999;position:relative;width:100%;height:100%;aspect-ratio:5/7;border-radius:14px;background:#fbfaf6;color:#1c2042;
  border:6px solid var(--rc);display:flex;flex-direction:column;padding:8px 10px 8px;overflow:hidden;box-shadow:0 8px 22px rgba(0,0,0,.22);text-align:left}
.card.r6{--rc:#ff4fd8;border-color:transparent;background:linear-gradient(#fbfaf6,#fbfaf6) padding-box,conic-gradient(from var(--ang,0deg),#ff4f4f,#ffcf3f,#5fd68f,#4fc3ff,#b46cff,#ff4fd8,#ff4f4f) border-box;animation:angspin 3s linear infinite}
@property --ang{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes angspin{to{--ang:360deg}}
.card.r6 .gems{background:linear-gradient(90deg,#ff4f4f,#ffcf3f,#5fd68f,#4fc3ff,#b46cff);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:1.1rem}
.card.r6::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:8px;mix-blend-mode:overlay;
  background:linear-gradient(115deg,transparent 15%,rgba(255,80,80,.6) 30%,rgba(255,220,80,.6) 40%,rgba(80,255,160,.6) 50%,rgba(80,190,255,.6) 60%,rgba(200,100,255,.6) 70%,transparent 85%);background-size:300% 100%;animation:holo 2.4s linear infinite}
.trans-txt{background:linear-gradient(90deg,#f2f4f8,#9aa3b5,#ffffff,#8d94a6,#e8ecf5);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700;text-shadow:0 0 12px rgba(220,230,255,.25)}
.spec-lines{display:flex;flex-direction:column;gap:3px;margin-top:auto;padding-top:6px;font-size:.72rem;color:#3a3f60;font-weight:700;line-height:1.25}
.card.lg .spec-lines{font-size:.85rem}
.card.r7{--rc:#c9d2e0;border-color:transparent;background:linear-gradient(#f7f8fb,#e8ebf2) padding-box,
  conic-gradient(from var(--ang,0deg),#ffffff,#9aa3b5,#f2f4f8,#7d8496,#ffffff,#b9c2d2,#ffffff) border-box;animation:angspin 4s linear infinite}
.card.r7 .gems{color:#7d8496;font-size:1.05rem}
.card.r7::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:8px;mix-blend-mode:overlay;
  background:linear-gradient(115deg,transparent 25%,rgba(255,255,255,.95) 45%,rgba(190,205,230,.7) 55%,transparent 75%);background-size:280% 100%;animation:holo 2.8s linear infinite}
.mini.r7{border:2px solid transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,conic-gradient(#ffffff,#9aa3b5,#f2f4f8,#7d8496,#ffffff) border-box}
.mini.r7 .mg{color:#dfe5f0}
.flip.hint7 .back{background:
  linear-gradient(135deg,rgba(255,255,255,.35) 0 8%,transparent 8% 18%,rgba(255,255,255,.22) 18% 24%,transparent 24% 40%),
  linear-gradient(160deg,#6c7482,#aab3c2 20%,#59606c 42%,#cfd6e2 58%,#6c7482 78%,#9aa3b1);
  border-color:#e9edf5}
.flip.hint7 .back .bk-gem{border-color:#f4f7ff;box-shadow:0 0 0 4px rgba(255,255,255,.25)}
.flip.hint7 .back,.flip.hint7 .back .bk-name{color:#f7f9ff}
.flip.hint7:not(.shown) .back{animation:aura7 1.4s ease-in-out infinite,tremble .3s linear infinite}
@keyframes aura7{0%,100%{box-shadow:0 0 18px 4px rgba(220,230,255,.6)}50%{box-shadow:0 0 52px 16px rgba(255,255,255,.95)}}
.myth-txt{background:linear-gradient(90deg,#ff4f4f,#ffcf3f,#5fd68f,#4fc3ff,#b46cff,#ff4fd8);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700}
.mini.r6{border:2px solid transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,conic-gradient(#ff4f4f,#ffcf3f,#5fd68f,#4fc3ff,#b46cff,#ff4fd8,#ff4f4f) border-box}
.mini.r6 .mg{background:linear-gradient(90deg,#ff4f4f,#ffcf3f,#4fc3ff,#b46cff);-webkit-background-clip:text;background-clip:text;color:transparent}
.flip.hint6 .back{background:
  radial-gradient(circle at 50% 44%,rgba(255,207,63,.25),transparent 45%),
  repeating-linear-gradient(45deg,#8e1622 0 10px,#7a111c 10px 20px)}
.flip.hint6:not(.shown) .back{animation:aura6 .9s linear infinite,tremble .35s linear infinite}
@keyframes aura6{0%{box-shadow:0 0 30px 8px #ff4f4f}20%{box-shadow:0 0 40px 12px #ffcf3f}40%{box-shadow:0 0 30px 8px #5fd68f}60%{box-shadow:0 0 40px 12px #4fc3ff}80%{box-shadow:0 0 30px 8px #b46cff}100%{box-shadow:0 0 30px 8px #ff4f4f}}

/* Mythique : la totale */
.legend.mythic{background:#05040c;animation:none;overflow:hidden}
.mythic .m-bg{position:absolute;inset:-20%;background:radial-gradient(circle at 50% 55%,rgba(255,79,216,.35),transparent 45%),radial-gradient(circle at 30% 40%,rgba(79,195,255,.25),transparent 40%),radial-gradient(circle at 70% 40%,rgba(255,207,63,.25),transparent 40%);opacity:0;animation:mbg 1s 1.2s ease-out forwards,hue 6s 1.2s linear infinite}
@keyframes mbg{to{opacity:1}}
@keyframes hue{to{filter:hue-rotate(360deg)}}
.mythic .m-beam{position:absolute;bottom:-10vh;width:34vw;height:150vh;transform-origin:50% 100%;mix-blend-mode:screen;opacity:0;
  clip-path:polygon(47% 100%,53% 100%,100% 0,0 0);background:linear-gradient(to top,var(--bc),transparent 85%);animation:beamIn .4s 1.2s forwards,sweep var(--sd,3s) 1.2s ease-in-out infinite alternate}
.mythic .m-beam.b1{left:-8vw;--bc:rgba(255,79,216,.55);--a0:-10deg;--a1:35deg}
.mythic .m-beam.b2{left:20vw;--bc:rgba(79,195,255,.5);--a0:-25deg;--a1:20deg;--sd:2.4s}
.mythic .m-beam.b3{right:20vw;--bc:rgba(255,207,63,.5);--a0:25deg;--a1:-20deg;--sd:2.7s}
.mythic .m-beam.b4{right:-8vw;--bc:rgba(95,214,143,.5);--a0:10deg;--a1:-35deg;--sd:3.3s}
@keyframes beamIn{to{opacity:1}}
@keyframes sweep{from{transform:rotate(var(--a0))}to{transform:rotate(var(--a1))}}
.mythic .rays{background:repeating-conic-gradient(from 0deg,rgba(255,79,79,.3) 0 4deg,transparent 4deg 10deg,rgba(255,207,63,.3) 10deg 14deg,transparent 14deg 20deg,rgba(79,195,255,.3) 20deg 24deg,transparent 24deg 30deg);opacity:0;animation:beamIn .5s 1.2s forwards,spin 9s linear infinite}
.mythic canvas{pointer-events:none}
.mythic .m-flash{position:absolute;inset:0;background:#fff;opacity:0;animation:mflash 1.1s 1.15s ease-out forwards;pointer-events:none;z-index:5}
@keyframes mflash{0%{opacity:0}8%{opacity:1}100%{opacity:0}}
.mythic .m-drum{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px;border-radius:50%;background:#fff;box-shadow:0 0 40px 20px #fff,0 0 120px 60px #ff4fd8;animation:charge 1.2s ease-in forwards}
@keyframes charge{0%{transform:scale(.2);opacity:.2}90%{transform:scale(3);opacity:1}100%{transform:scale(40);opacity:0}}
.mythic .lg-title{font-size:clamp(2.8rem,11vw,6rem);background:linear-gradient(90deg,#ff4f4f,#ffcf3f,#5fd68f,#4fc3ff,#b46cff,#ff4fd8,#ff4f4f);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 22px rgba(255,255,255,.55));animation:titleIn .8s 1.3s cubic-bezier(.3,1.6,.5,1) both,shine 2s 1.3s linear infinite}
.mythic .lg-card{animation:cardIn 1.4s 1.2s cubic-bezier(.2,.9,.3,1) both;filter:drop-shadow(0 0 30px #ff4fd8) drop-shadow(0 0 60px #4fc3ff)}
.mythic .lg-name{position:relative;font-family:var(--display);font-weight:700;font-size:1.4rem;color:#fff;animation:lgIn .6s 2.4s both;text-shadow:0 0 12px #ff4fd8}
.mythic .lg-sub{animation:lgIn .5s 3s both}
.card.r4{--rc:#2fd4c9}
.card.r4::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:8px;mix-blend-mode:overlay;
  background:linear-gradient(115deg,transparent 25%,rgba(120,255,240,.75) 42%,rgba(255,255,255,.7) 50%,rgba(90,220,255,.7) 58%,transparent 78%);background-size:260% 100%;animation:holo 3.6s linear infinite}
.mini.r4{border-color:#2fd4c9}
.flip.hint4:not(.shown) .back{animation:aura4 1.9s ease-in-out infinite}
@keyframes aura4{0%,100%{box-shadow:0 0 0 rgba(47,212,201,0)}50%{box-shadow:0 0 30px 7px rgba(47,212,201,.9)}}
.rar-pick.r4 b{color:var(--r4)}
.card.r0{--rc:#b9bccb}.card.r1{--rc:#5fbf83}.card.r2{--rc:#5a9df0}.card.r3{--rc:#a86ef0}.card.r5{--rc:#f1b72a}
.card-top{display:flex;justify-content:space-between;align-items:center;font-size:.72rem;font-weight:700;color:#5b6088}
.gems{color:var(--rc);letter-spacing:1px;font-size:.8rem}
.card.r0 .gems{color:#8a8fa8}
.art{position:relative;margin:5px 0 7px;border-radius:9px;flex:0 0 38%;overflow:hidden;
  background:
    repeating-radial-gradient(circle at 78% 30%,rgba(255,255,255,.22) 0 3px,transparent 3px 16px),
    linear-gradient(135deg,var(--c1),var(--c2));
  display:flex;align-items:flex-end;justify-content:space-between;padding:4px 8px}
.art-no{position:absolute;right:-6px;bottom:-18px;font-family:var(--display);font-weight:700;font-size:4.6rem;line-height:1;color:rgba(255,255,255,.34);letter-spacing:-.04em}
.art-initial{position:absolute;left:10px;top:4px;font-family:var(--display);font-weight:700;font-size:3.3rem;line-height:1;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.18)}
.art-gen{position:relative;font-size:.68rem;font-weight:700;color:#fff;background:rgba(0,0,0,.25);border-radius:6px;padding:0 6px}
.card-name{font-family:var(--display);font-weight:700;font-size:1.3rem;line-height:1.05;letter-spacing:-.01em}
.genus{font-size:.72rem;color:#5b6088;margin-bottom:5px}
.types{display:flex;gap:4px;flex-wrap:wrap}
.type{background:var(--t);color:#fff;font-size:.66rem;font-weight:700;border-radius:999px;padding:1px 8px;text-shadow:0 1px 1px rgba(0,0,0,.35)}
.stats{display:grid;grid-template-columns:auto 1fr auto auto 1fr auto;gap:2px 5px;align-items:center;font-size:.64rem;margin-top:auto;padding-top:6px}
.stats span{color:#5b6088;font-weight:700}
.stats i{display:block;height:5px;border-radius:3px;background:#e5e4ee;overflow:hidden}
.stats i b{display:block;height:100%;background:linear-gradient(90deg,var(--c1),var(--c2))}
.stats em{font-style:normal;font-weight:700;text-align:right}
.card-foot{display:flex;justify-content:space-between;font-size:.64rem;color:#5b6088;margin-top:5px;font-weight:700}
.card.r5::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:8px;mix-blend-mode:overlay;
  background:linear-gradient(115deg,transparent 20%,rgba(255,255,255,.75) 38%,rgba(255,120,220,.5) 46%,rgba(90,220,255,.5) 54%,transparent 72%);
  background-size:250% 100%;animation:holo 3.2s linear infinite}
.card.r3::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:8px;
  background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.45) 50%,transparent 65%);background-size:250% 100%;animation:holo 4.5s linear infinite}
@keyframes holo{from{background-position:120% 0}to{background-position:-120% 0}}
.card.lg{font-size:17px}
.card.lg .stats{grid-template-columns:auto 1fr auto;font-size:.68rem;gap:0 8px;padding-top:4px}
.card.lg .art{flex:0 0 34%}
.card.lg .genus{margin-bottom:3px}
.card.lg .card-foot{margin-top:4px}
.card.lg .card-name{font-size:1.55rem}
.card.lg .art-no{font-size:5.4rem}

/* Mini card (grid) */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.mini{position:relative;border:0;padding:0;text-align:left;border-radius:12px;background:var(--surface);border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column}
.mini .strip{height:44px;background:linear-gradient(135deg,var(--c1),var(--c2));position:relative;overflow:hidden}
.mini .strip b{position:absolute;right:-2px;bottom:-12px;font-family:var(--display);font-size:2.3rem;color:rgba(255,255,255,.4);line-height:1}
.mini .mi{padding:6px 8px 8px}
.mini .mn{font-family:var(--display);font-weight:600;font-size:.98rem;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini .mm{display:flex;justify-content:space-between;font-size:.72rem;color:var(--ink-soft);margin-top:2px}
.mini .mg{letter-spacing:1px}
.mini.r0 .mg{color:var(--r0)}.mini.r1 .mg{color:var(--r1)}.mini.r2 .mg{color:var(--r2)}.mini.r3 .mg{color:var(--r3)}.mini.r5 .mg{color:var(--r5)}
.mini.r5{border-color:var(--r5)}
.mini.missing{opacity:.45}
.mini.missing .strip{background:repeating-linear-gradient(45deg,var(--surface-2) 0 6px,transparent 6px 12px)}
.mini .count{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.55);color:#fff;font-weight:700;font-size:.72rem;border-radius:999px;padding:0 7px}
.mini .fav-badge{position:absolute;top:6px;right:6px;color:#ffcf3f;font-size:.95rem;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.fav-btn.on{background:var(--gold);color:var(--gold-ink)}
.mini .sel{position:absolute;top:6px;right:6px;background:var(--danger);color:#fff;font-weight:700;font-size:.72rem;border-radius:999px;padding:0 7px}
.mini.picked{outline:3px solid var(--danger);outline-offset:-3px}
.mini.choice{outline:3px solid var(--gold);outline-offset:-3px}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0}
.toolbar input,.toolbar select,.field input,.field select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.toolbar input[type=search]{flex:1 1 200px}
.progress{height:10px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.progress b{display:block;height:100%;background:var(--gold)}
.col-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px}
.col-stat{font-family:var(--display);font-weight:700;font-size:1.6rem}
.col-stat span{color:var(--ink-soft);font-size:1.1rem}
.rar-counts{display:flex;flex-wrap:wrap;gap:12px;font-size:.9rem;margin-top:6px}
.rar-counts span b{font-family:var(--display)}

.discard-help{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:6px 0 12px}
.rar-picks{display:flex;flex-wrap:wrap;gap:8px}
.rar-pick{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:6px 12px;text-align:left}
.rar-pick b{font-size:.9rem}
.rar-pick span{font-size:.78rem;color:var(--ink-soft);font-weight:700}
.rar-pick.r0 b{color:var(--r0)}.rar-pick.r1 b{color:var(--r1)}.rar-pick.r2 b{color:var(--r2)}.rar-pick.r3 b{color:var(--r3)}.rar-pick.r5 b{color:var(--r5)}
.rar-pick.r6 b{color:var(--r6)}.rar-pick.r7 b{color:#cfd6e2}
.rar-pick[aria-pressed="true"]{border-color:var(--gold);background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--gold)}
.discard-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;gap:14px;align-items:center;
  background:var(--surface);border:2px solid var(--gold);border-radius:20px;padding:12px 16px;box-shadow:0 16px 40px rgba(0,0,0,.45),0 0 0 6px color-mix(in srgb,var(--gold) 18%,transparent);
  max-width:calc(100% - 20px);flex-wrap:wrap;justify-content:center;animation:barIn .25s ease-out}
@keyframes barIn{from{transform:translate(-50%,20px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.discard-bar .sum{display:flex;flex-direction:column;line-height:1.2}
.discard-bar .sum b{font-family:var(--display);font-size:1.15rem}
.discard-bar .sum span{font-size:.82rem;color:var(--ink-soft);font-weight:700}
.discard-bar .go{font-size:1.02rem;padding:12px 22px;border-radius:14px;display:flex;align-items:center;gap:8px}
.discard-bar .go:not(:disabled){animation:goPulse 1.8s ease-in-out infinite}
@keyframes goPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,207,63,.55)}50%{box-shadow:0 0 0 10px rgba(255,207,63,0)}}
.discard-bar.empty{border-color:var(--line);box-shadow:0 10px 30px rgba(0,0,0,.35)}
@media (max-width:560px){.discard-bar{width:calc(100% - 20px);flex-direction:column;gap:8px}.discard-bar .go{width:100%;justify-content:center}}

/* Market */
.market{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.offer{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;grid-template-columns:96px 1fr;gap:12px}
.offer .thumb{width:96px}
.offer .thumb .card{font-size:9px;padding:4px 5px;border-width:4px;border-radius:9px}
.offer .thumb .card .card-name{font-size:.95rem}
.offer .thumb .card .art-no{font-size:2.6rem;bottom:-9px}
.offer .thumb .card .art-initial{font-size:1.8rem}
.offer .thumb .card .stats,.offer .thumb .card .genus,.offer .thumb .card .card-foot{display:none}
.offer .info{display:flex;flex-direction:column;gap:4px;min-width:0}
.offer .price{font-family:var(--display);font-weight:700;font-size:1.3rem}
.offer .by{font-size:.85rem;color:var(--ink-soft)}
.offer .row{display:flex;gap:6px;margin-top:auto;flex-wrap:wrap}
.offer .row input{width:80px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.tag{display:inline-block;font-size:.75rem;font-weight:700;border-radius:999px;padding:1px 8px;background:var(--surface-2)}
.section{margin-top:28px}
.section h2{margin-bottom:12px}

/* Leaderboard */
.lb{display:flex;flex-direction:column;gap:8px;max-width:720px}
.lb-row{display:grid;grid-template-columns:32px 36px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.lb-row.me{border-color:var(--gold)}
.lb-row .rk{font-family:var(--display);font-weight:700;font-size:1.2rem;text-align:center}
.ava{--s:36px;position:relative;flex:0 0 auto;width:var(--s);height:var(--s);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;
  background:repeating-radial-gradient(circle at 70% 30%,rgba(255,255,255,.2) 0 2px,transparent 2px 8px),linear-gradient(135deg,var(--c1),var(--c2));
  color:#fff;font-family:var(--display);font-weight:700;font-size:calc(var(--s)*.5);box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--line);vertical-align:middle}
.ava img{position:absolute;inset:6%;width:88%;height:88%;object-fit:contain;z-index:1}
.ava img+b{visibility:hidden}
.ava-none{background:var(--surface-2);color:var(--gold)}
.art-img{position:absolute;inset:4% 20%;width:60%;height:92%;object-fit:contain;z-index:1}
.art-img~.art-initial{display:none}
@media (max-width:1300px){.brand{font-size:1rem}nav.tabs button{font-size:.76rem;padding:4px 6px}.chip{font-size:.74rem;padding:3px 8px;gap:4px}.chip b{font-size:.9rem}.ava{--s:22px!important}}

@media (max-width:1150px){.top-in{flex-wrap:wrap}nav.tabs{order:3;flex-basis:100%;flex-wrap:wrap}.chips{margin-left:auto;flex-wrap:wrap}}

  s.byr=[0,0,0,0,0,0,0,0];for(const k of Object.keys(s.coll))s.byr[rar(+k)]++;s.byrV=BYR_V;s.total=Object.values(s.coll).reduce((a,b)=>a+b,0);if(s.avatar&&!s.coll[String(s.avatar)])s.avatar=null;
  if(s.fav)for(const k of Object.keys(s.fav))if(!s.coll[k])delete s.fav[k];
  if(BETA_OPEN)s.beta=true;
  s.updated=Date.now()}

let queue=Promise.resolve();
function run(task){const p=queue.then(task);queue=p.catch(()=>{});return p.catch(e=>{toast(e&&e.message?e.message:"Action impossible, réessayez.");console.error(e)})}

async function lease(ref){
  for(let i=0;i<10;i++){const r=await ref.acquire({holder:TAB,ttlMs:4000});if(r.acquired)return;await sleep(300+rnd(500))}
  throw new Error("Quelqu’un d’autre modifie cet élément, réessayez dans un instant.");
}
async function mutateMe(fn){
  if(mode==="local"){const s=clone(S);if(fn(s)===false)return false;stamp(s);S=s;try{localStorage.setItem("les1025",JSON.stringify(S))}catch(e){}renderAll();return true}
  const ref=db.doc("players/"+ME);await lease(ref);
  const snap=await ref.get();const s=norm(snap.exists?clone(snap.data()):null);
  if(fn(s)===false)return false;stamp(s);await ref.set(s);S=s;renderAll();return true;
}

/* ---------- boosters ---------- */
function rollRarity(){let x=rnd(SCALE);for(let r=0;r<ODDS_K.length;r++){if(x<ODDS_K[r])return r;x-=ODDS_K[r]}return 0}
let opening=false;
const MULTI=5;
const OPEN_OPTS=[1,5,10];
const available=s=>packInfo(s).n+(s.bonus||0);
function openPack(k=1){
  if(opening||!OPEN_OPTS.includes(k))return;opening=true;
  run(async()=>{
    let drawn=null;
    const ok=await mutateMe(s=>{
      if(available(s)<k)return false;
      drawn=[];
      for(let b=0;b<k;b++){
        const p=packInfo(s),now=Date.now();
        if(p.n>=1){if(p.n>=MAXP){s.packs=MAXP-1;s.packTs=now}else{s.packs=p.n-1;s.packTs=s.packTs+p.g*PER}}
        else s.bonus--;
        for(let i=0;i<CARDS;i++){const r=rollRarity(),id=BYR[r][rnd(BYR[r].length)];drawn.push({id,isNew:!has(s,id),shown:false});add(s,id)}
      }
    });
    if(!ok){toast(k>1?`Il vous faut ${k} boosters disponibles pour en ouvrir ${k} d’un coup.`:"Aucun booster disponible. Attendez le prochain ou passez par la boutique.");return}
    SFX.open(k>1);
    const pk=$(".pack");if(pk&&!matchMedia("(prefers-reduced-motion: reduce)").matches){pk.classList.add("tear");await sleep(520)}
    reveal=drawn;hitsMode=false;handScroll=0;
    renderView();window.scrollTo(0,0);
  }).finally(()=>{opening=false});
}

/* ---------- market settlement ---------- */
let settling=false;
function needsSettle(){
  if(mode!=="online"||!marketReady||!S)return false;
  const now=Date.now();
  for(const [mid,l] of Object.entries(S.listings)){
    if(l.k==="o"){const tm=MARKET[l.m];
      if(!tm)return now-(l.t||0)>60000;
      const o=(tm.offers||{})[mid];
      if(!o)return now-(l.t||0)>60000;
      if(o.status==="accepted"||o.status==="declined"||tm.status==="cancel")return true;
      continue}
    const m=MARKET[mid];if(!m){if(now-(l.t||0)>60000)return true;continue}
    if(m.kind==="a"&&now>=m.endsAt)return true;
    if(l.k==="t"&&m.status==="cancel")return true;}
  for(const [mid,e] of Object.entries(S.escrow)){const m=MARKET[mid];if(!m){if(now-(e.t||0)>60000)return true;continue}
    if(m.bidder!==ME||now>=m.endsAt)return true}
  return false;
}
function settle(){
  if(settling||!needsSettle())return;settling=true;
  run(async()=>{
    const post=[];let gained=0,items=[];
    await mutateMe(s=>{
      let ch=false;const now=Date.now();
      for(const [mid,l] of Object.entries(s.listings)){
        if(l.k==="o"){
          const tm=MARKET[l.m];
          if(!tm){if(now-(l.t||0)>60000){add(s,l.c);delete s.listings[mid];ch=true}continue}
          const o=(tm.offers||{})[mid];
          if(!o){if(now-(l.t||0)>60000){add(s,l.c);delete s.listings[mid];ch=true}continue}
          if(o.status==="accepted"){add(s,tm.card);items.push(tm.card);delete s.listings[mid];ch=true;post.push(["offer",l.m,mid])}
          else if(o.status==="declined"||tm.status==="cancel"){add(s,l.c);delete s.listings[mid];ch=true;post.push(["offer",l.m,mid])}
          continue;
        }
        const m=MARKET[mid];
        if(!m){if(now-(l.t||0)>60000){add(s,l.c);delete s.listings[mid];ch=true}continue}
        if(m.kind==="a"&&now>=m.endsAt){
          if(m.bidder){s.credits+=m.bid;gained+=m.bid}else{add(s,m.card);items.push(m.card)}
          delete s.listings[mid];ch=true;post.push(["seller",mid]);
        }else if(m.kind==="t"&&l.k==="t"&&(m.status==="cancel")){add(s,m.card);items.push(m.card);delete s.listings[mid];ch=true}

      }
      for(const [mid,e] of Object.entries(s.escrow)){
        const m=MARKET[mid];
        if(!m){if(now-(e.t||0)>60000){s.credits+=e.a;delete s.escrow[mid];ch=true}continue}
        if(m.bidder!==ME){s.credits+=e.a;delete s.escrow[mid];ch=true}
        else if(now>=m.endsAt){add(s,m.card);items.push(m.card);delete s.escrow[mid];ch=true;post.push(["buyer",mid])}
      }
      return ch?undefined:false;
    });
    for(const [what,mid,oid] of post){
      const ref=db.doc("market/"+mid);
      try{
        if(what==="offer"){
          await lease(ref);const snap=await ref.get();if(!snap.exists)continue;const m=snap.data();
          const offers=Object.assign({},m.offers||{});
          if(offers[oid])offers[oid]=Object.assign({},offers[oid],{status:offers[oid].status==="accepted"?"claimed":"returned"});
          const alive=Object.values(offers).some(o=>o.status==="pending");
          if(m.status!=="open"&&!alive)await ref.delete();else await ref.update({offers});
          continue;
        }
        if(what==="del"){await ref.delete();continue}
        await lease(ref);const snap=await ref.get();if(!snap.exists)continue;const m=snap.data();
        const flag=what==="seller"?"sellerDone":"buyerDone",other=what==="seller"?"buyerDone":"sellerDone";
        if(!m.bidder||m[other])await ref.delete();else await ref.update({[flag]:true});
      }catch(e){console.warn(e)}
    }
    if(gained)toast(`Vente conclue : +${gained} crédits.`);
    else if(items.length)toast(items.length===1?`${nm(items[0])} a rejoint votre collection.`:`${items.length} cartes ont rejoint votre collection.`);
  }).finally(()=>{settling=false});
}

const collOf=uid=>(uid===ME?S&&S.coll:(PLAYERS[uid]||{}).coll)||{};
const ownerHas=(uid,id)=>((collOf(uid)[String(id)]||0)>0);
const offersOf=m=>Object.entries(m.offers||{}).filter(([,o])=>o.status==="pending");
const myOffer=(mid,m)=>Object.entries(m.offers||{}).find(([,o])=>o.by===ME&&o.status==="pending");

}
function canOffer(m,c){
  if(rar(c)!==rar(m.card))return false;

  if(m.wantMode==="missing")return !ownerHas(m.owner,c);

/* --- proposer une carte sur une annonce --- */
function proposeTrade(mid_,give){
  return run(async()=>{
    const ref=db.doc("market/"+mid_);await lease(ref);
    const snap=await ref.get();if(!snap.exists){toast("Cet échange n’est plus disponible.");return}
    const m=snap.data();
    if(m.status!=="open"){toast("Cet échange est clos.");return}
    if(m.owner===ME){toast("C’est votre propre annonce.");return}
    if(!canOffer(m,give)){toast("Cette carte ne correspond pas à la demande.");return}
    if(myOffer(mid_,m)){toast("Vous avez déjà une proposition en attente sur cet échange.");return}
    const oid=mid(),now=Date.now();
    const ok=await mutateMe(s=>{if(!has(s,give))return false;add(s,give,-1);s.listings[oid]={k:"o",c:give,m:mid_,t:now}});
    if(!ok){toast("Vous ne possédez plus cette carte.");return}
    const offers=Object.assign({},m.offers||{});offers[oid]={by:ME,card:give,at:now,status:"pending"};
    try{await ref.update({offers})}
    catch(e){await mutateMe(s=>{add(s,give);delete s.listings[oid]});throw e}
    closeDlg();toast(`Proposition envoyée. ${nm(m.card)} reste à ${who(m.owner)} tant qu’il n’a pas accepté.`);
  });
}
function withdrawOffer(mid_,oid){
  return run(async()=>{
    const ref=db.doc("market/"+mid_);await lease(ref);
    const snap=await ref.get();
    if(snap.exists){
      const m=snap.data(),o=(m.offers||{})[oid];
      if(o&&o.status!=="pending"){toast("Cette proposition a déjà été traitée.");return}
      if(o){const offers=Object.assign({},m.offers);offers[oid]=Object.assign({},o,{status:"withdrawn"});await ref.update({offers})}
    }
    await mutateMe(s=>{const l=s.listings[oid];if(!l)return false;add(s,l.c);delete s.listings[oid]});
    toast("Proposition retirée, votre carte revient dans votre collection.");
  });
}
function answerOffer(mid_,oid,accept){
  return run(async()=>{
    const ref=db.doc("market/"+mid_);await lease(ref);
    const snap=await ref.get();if(!snap.exists){toast("Cette annonce n’existe plus.");return}
    const m=snap.data();
    if(m.owner!==ME){toast("Cette annonce n’est pas la vôtre.");return}
    const o=(m.offers||{})[oid];
    if(!o||o.status!=="pending"){toast("Cette proposition n’est plus en attente.");return}
    const offers=Object.assign({},m.offers);
    if(!accept){
      offers[oid]=Object.assign({},o,{status:"declined"});
      await ref.update({offers});toast("Proposition refusée, la carte retourne à son propriétaire.");return;
    }
    const ok=await mutateMe(s=>{const l=s.listings[mid_];if(!l)return false;add(s,o.card);delete s.listings[mid_]});
    if(!ok){toast("Cette annonce n’est plus active.");return}
    offers[oid]=Object.assign({},o,{status:"accepted"});
    for(const [k,v] of Object.entries(offers))if(k!==oid&&v.status==="pending")offers[k]=Object.assign({},v,{status:"declined"});
    try{await ref.update({offers,status:"done",taker:o.by,got:o.card,doneAt:Date.now()})}
    catch(e){await mutateMe(s=>{add(s,o.card,-1);s.listings[mid_]={k:"t",c:m.card,t:Date.now()}});throw e}
    toast(`Échange conclu : ${nm(o.card)} rejoint votre collection.`);
  });
}
function cancelListing(id){
  return run(async()=>{
    const ref=db.doc("market/"+id);await lease(ref);
    const snap=await ref.get();if(!snap.exists){toast("Cette annonce n’existe plus.");return}
    const m=snap.data();
    if(m.kind==="a"&&(m.bidder||Date.now()>=m.endsAt)){toast("Impossible d’annuler : l’enchère a déjà reçu une offre.");return}
    if(m.kind==="t"&&m.status!=="open"){toast("Trop tard : l’échange vient d’être conclu.");return}
    if(m.kind==="t"){
      const offers=Object.assign({},m.offers||{});let pending=false;
      for(const [k,o] of Object.entries(offers))if(o.status==="pending"){offers[k]=Object.assign({},o,{status:"declined"});pending=true}
      if(pending)await ref.update({offers,status:"cancel"});else await ref.delete();
    }else await ref.delete();
    await mutateMe(s=>{const l=s.listings[id];if(!l)return false;add(s,l.c);delete s.listings[id]});
    toast("Annonce retirée, la carte est revenue dans votre collection.");
  });
}
function placeBid(id,amount){
  return run(async()=>{
    amount=Math.floor(amount);
    const ref=db.doc("market/"+id);await lease(ref);
    const snap=await ref.get();if(!snap.exists){toast("Cette enchère est terminée.");return}
    const m=snap.data(),now=Date.now();
    if(m.seller===ME){toast("Vous ne pouvez pas enchérir sur votre propre carte.");return}
    if(now>=m.endsAt){toast("Cette enchère est terminée.");return}
    const min=m.bidder?m.bid+1:m.start;
    if(!(amount>=min)){toast(`L’offre minimale est de ${min} crédits.`);return}
    if(m.bidder===ME&&amount<=m.bid){toast("Vous êtes déjà le meilleur enchérisseur.");return}
    let prevEsc=null;
    const ok=await mutateMe(s=>{const prev=s.escrow[id]?s.escrow[id].a:0;const need=amount-prev;if(s.credits<need)return false;prevEsc=s.escrow[id]||null;s.credits-=need;s.escrow[id]={a:amount,t:now}});
    if(!ok){toast("Vous n’avez pas assez de crédits.");return}
    try{await ref.update({bid:amount,bidder:ME,lastBid:now})}
    catch(e){await mutateMe(s=>{const cur=s.escrow[id];if(!cur)return false;s.credits+=cur.a-(prevEsc?prevEsc.a:0);if(prevEsc)s.escrow[id]=prevEsc;else delete s.escrow[id]});throw e}
    toast(`Offre de ${amount} crédits enregistrée.`);
  });
}

  });
}

function recapHTML(){

let handScroll=0,dragMoved=false;
function handCards(){return [...document.querySelectorAll("#hand .flip")]}
function fanUpdate(){
  const h=$("#hand");if(!h)return;handScroll=h.scrollLeft;
  const center=h.scrollLeft+h.clientWidth/2,cards=handCards();let cur=0,best=1e9;
  cards.forEach((el,i)=>{
    const d=(el.offsetLeft+el.offsetWidth/2-center)/el.offsetWidth,a=Math.min(Math.abs(d),4);
    if(Math.abs(d)<best){best=Math.abs(d);cur=i}
    el.style.transform=RM()?"":`translateY(${Math.pow(a,1.3)*16}px) rotate(${Math.max(-4,Math.min(4,d))*6}deg) scale(${1-Math.min(a,3)*.07})`;
    el.style.zIndex=String(100-Math.round(a*10));
  });
  cards.forEach((el,i)=>el.classList.toggle("current",i===cur));
  const cnt=$("#hand-count");if(cnt)cnt.textContent=`${cur+1} / ${cards.length}`;
  const pv=document.querySelector("[data-act=hand-prev]"),nx=document.querySelector("[data-act=hand-next]");
  if(pv)pv.disabled=cur===0;if(nx)nx.disabled=cur===cards.length-1;
  return cur;
}
function centerCard(el,instant){
  const h=$("#hand");if(!h||!el)return;
  h.scrollTo({left:el.offsetLeft+el.offsetWidth/2-h.clientWidth/2,behavior:instant||RM()?"auto":"smooth"});
}
function handStep(dir){const cards=handCards(),cur=fanUpdate();const el=cards[Math.max(0,Math.min(cards.length-1,cur+dir))];centerCard(el)}
function setupHand(){
  const h=$("#hand");if(!h)return;
  h.scrollLeft=handScroll;fanUpdate();
  let raf=0;h.addEventListener("scroll",()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(fanUpdate)},{passive:true});
  h.addEventListener("wheel",e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){h.scrollBy({left:e.deltaY*1.2});e.preventDefault()}},{passive:false});
  h.addEventListener("pointerdown",e=>{if(e.pointerType!=="mouse"||e.button!==0)return;drag.down=true;dragMoved=false;drag.sx=e.clientX;drag.sl=h.scrollLeft});
}
const drag={down:false,sx:0,sl:0};
addEventListener("pointermove",e=>{if(!drag.down)return;const h=$("#hand");if(!h)return;const dx=e.clientX-drag.sx;if(Math.abs(dx)>6){dragMoved=true;h.classList.add("dragging")}if(dragMoved)h.scrollLeft=drag.sl-dx});
addEventListener("pointerup",()=>{if(!drag.down)return;drag.down=false;const h=$("#hand");if(h&&dragMoved){const cur=fanUpdate();h.classList.remove("dragging");centerCard(handCards()[cur])}});
addEventListener("resize",()=>{if($("#hand"))fanUpdate()});

function filtered(){
  const q=filt.q.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  const out=[];
  const pool=[...HIDDEN_IDS.filter(id=>S.coll[id]),...DEX_ORDER];
  for(const id of pool){
    const d=D(id),c=S.coll[id]||0;
    if(filt.own==="fav"&&!(S.fav&&S.fav[id]))continue;
    if(filt.own==="own"&&!c)continue;if(filt.own==="missing"&&c)continue;if(filt.own==="dup"&&c<2)continue;
    if(filt.r!=="all"&&d[7]!=+filt.r)continue;if(filt.g!=="all"&&d[2]!=+filt.g)continue;
    if(filt.t!=="all"&&!(d[3]||[]).includes(+filt.t))continue;
    if(q){const n=d[0].toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");if(!(c&&n.includes(q))&&String(id)!==q)continue}
    out.push(id);
  }
  return out;
}

let aucMissing=false,aucQ="",trdQ="";
const norm2=s=>String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
function cardMatches(id,q){
  q=norm2(q).trim();if(!q)return true;
  const d=D(id);if(!d)return false;
  if(norm2(d[0]).includes(q))return true;
  if(String(id)===q||pad(id)===q)return true;
  const ex=d[8];if(ex&&ex.base&&(String(ex.base)===q||pad(ex.base)===q))return true;
  return norm2(RAR[d[7]]).includes(q);
}

    </div>`};
  return `<h1>Évolutions</h1>

  ${(()=>{const plan=quickEvoPlan();return `<div class="actions" style="margin-top:12px">

/* Évolution rapide : tous les Pokémon en 4 exemplaires ou plus dont l'évolution manque */
function quickEvoPlan(){
  const c={};for(const [k,v] of Object.entries(S.coll))c[+k]=v;
  const plan=[];
  for(const id of Object.keys(c).map(Number).filter(canEvolve).sort((a,b)=>c[b]-c[a]||a-b)){
    let guard=0;
    while(c[id]>=EVO_COST+1&&guard++<60){
      const to=evoTargets(id).find(x=>!(c[x]>0));if(!to)break;
      c[id]-=EVO_COST;c[to]=(c[to]||0)+1;plan.push([id,to]);
    }
  }
  return plan;
}
function quickEvoDlg(){
  const plan=quickEvoPlan();if(!plan.length)return;
  const gains=plan.map(([,to])=>to);
  openDlg(`<div class="side"><button class="close-x" data-act="close" aria-label="Fermer">×</button>

/* Vide toutes les annonces et rend les cartes et crédits engagés */
function clearMarket(){
  run(async()=>{
    const entries=Object.entries(MARKET);
    if(!entries.length){toast("Il n’y a aucune annonce en cours.");return}
    const jobs={};
    const push=(uid,item)=>{if(!uid)return;(jobs[uid]=jobs[uid]||[]).push(item)};
    for(const [mid_,m] of entries){
      if(m.kind==="a"){push(m.seller,{listing:mid_});if(m.bidder)push(m.bidder,{escrow:mid_})}
      else{push(m.owner,{listing:mid_});for(const [oid,o] of Object.entries(m.offers||{}))if(o.status==="pending")push(o.by,{listing:oid})}
    }
    let cards=0,credits=0,fails=0;
    for(const [uid,items] of Object.entries(jobs)){
      try{
        await mutatePlayer(uid,s=>{
          let ch=false;
          for(const it of items){
            if(it.listing&&s.listings[it.listing]){add(s,s.listings[it.listing].c);delete s.listings[it.listing];cards++;ch=true}
            if(it.escrow&&s.escrow[it.escrow]){s.credits+=s.escrow[it.escrow].a;credits+=s.escrow[it.escrow].a;delete s.escrow[it.escrow];ch=true}
          }
          return ch?undefined:false;
        });
      }catch(e){fails++;console.warn(e)}
    }
    for(const [mid_] of entries){try{await db.doc("market/"+mid_).delete()}catch(e){fails++;console.warn(e)}}
    MARKET={};renderAll();
    toast(`Marché vidé : ${cards} carte${cards>1?"s":""} rendue${cards>1?"s":""}${credits?`, ${fmtN(credits)} crédits remboursés`:""}${fails?`, ${fails} erreur${fails>1?"s":""}`:""}.`);
  });
}

/* --- couche de données : même interface que dans la version claude.ai --- */
function makeDb(sb){
  const cache={};      // coll -> {id: data}
  const subs={};       // coll -> [cb]
  const emit=coll=>{
    const docs=Object.entries(cache[coll]||{}).map(([id,data])=>({id,data:()=>data}));
    (subs[coll]||[]).forEach(cb=>{try{cb({docs,metadata:{fromCache:false}})}catch(e){console.warn(e)}});
  };
  async function load(coll){
    const {data,error}=await sb.from("docs").select("path,data").eq("coll",coll);
    if(error){DIAG.readErr=true;console.warn(error);return}
    const m={};(data||[]).forEach(r=>m[r.path.slice(coll.length+1)]=r.data);
    cache[coll]=m;emit(coll);
  }
  return {
    doc(path){
      const coll=path.split("/")[0],id=path.slice(coll.length+1);
      return {
        async get(){
          const {data,error}=await sb.from("docs").select("data").eq("path",path).maybeSingle();
          if(error)throw error;
          return {exists:!!data,data:()=>data?data.data:null};
        },
        async set(obj){
          const {error}=await sb.from("docs").upsert({path,coll,data:obj,updated_at:nowIso()},{onConflict:"path"});
          if(error)throw new Error(error.message);
          cache[coll]=cache[coll]||{};cache[coll][id]=obj;emit(coll);
        },
        async update(partial){
          const cur=(await this.get()).data()||{};
          await this.set(Object.assign({},cur,partial));
        },
        async delete(){
          const {error}=await sb.from("docs").delete().eq("path",path);
          if(error)throw error;
          if(cache[coll])delete cache[coll][id];emit(coll);
        },
        async acquire({holder,ttlMs}){
          const until=new Date(Date.now()+ttlMs).toISOString();
          const {data,error}=await sb.rpc("acquire_lease",{p_path:path,p_holder:holder,p_until:until});
          if(error){console.warn(error);return {acquired:true}} // pas de verrou disponible : on continue
          return {acquired:!!data};
        }
      };
    },
    collection(coll){
      return {onSnapshot(cb,onErr){
        subs[coll]=subs[coll]||[];subs[coll].push(cb);
        load(coll);
        setInterval(()=>load(coll),15000);
        try{
          sb.channel("docs-"+coll).on("postgres_changes",{event:"*",schema:"public",table:"docs",filter:"coll=eq."+coll},payload=>{
            cache[coll]=cache[coll]||{};
            const row=payload.new&&payload.new.path?payload.new:payload.old;
            if(!row)return;const id=row.path.slice(coll.length+1);
            if(payload.eventType==="DELETE")delete cache[coll][id];else cache[coll][id]=payload.new.data;
            emit(coll);
          }).subscribe();
        }catch(e){console.warn(e)}
      }};
    }
  };
}

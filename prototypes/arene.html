<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arène DexCraft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Maquette jouable de l'Arène (combat automatique façon Teamfight Tactics, en simplifié), aux couleurs de DexCraft.
   Tout se joue ici, sans serveur : collection simulée, crédits fictifs. Données réelles lues dans ../index.html.
   Tout tient dans la fenêtre, sans défiler : la taille des cases (--s) suit la hauteur de l'écran. */
:root{
  --bg:#eef0fa;--surface:#fff;--surface-2:#e3e6f5;--ink:#1c2042;--ink-soft:#5b6088;--line:#cfd3ea;--gold:#e0a800;--gold-ink:#3a2a00;--danger:#c8324b;--ok:#1f8a4c;
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;--body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r0:#9aa0b8;--r1:#3fbf7f;--r2:#4c8dff;--r3:#b06cff;--r5:#ffb400;
  --s:clamp(40px,calc((100dvh - 300px) / 6.3),100px);                 /* case du terrain */
  --b:min(calc(var(--s) * .82),calc((100vw - 64px) / 8));             /* case du banc */
  --o:min(calc(var(--s) * 1.02),calc((100vw - 56px) / 5));            /* offre de la boutique */
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#161a33;--surface:#20264a;--surface-2:#2a3160;--ink:#f1f0ff;--ink-soft:#a7abd3;--line:#363e72;--gold:#ffcf3f;--gold-ink:#2b1f00;--danger:#ff6b81;--ok:#5fd68f}}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.3;-webkit-tap-highlight-color:transparent;overflow:hidden}
main{height:100dvh;max-width:1500px;margin:0 auto;padding:8px 12px;display:flex;flex-direction:column;gap:6px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1}
.muted{color:var(--ink-soft)}
.btn{font:inherit;border:0;border-radius:11px;padding:8px 14px;font-weight:700;background:var(--surface-2);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--gold);color:var(--gold-ink)}
.btn.danger{background:var(--danger);color:#fff}
.btn.on{background:var(--ink);color:var(--bg)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{padding:5px 9px;font-size:.8rem}
/* barre du haut */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.top h1{font-size:1.35rem;margin-right:4px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px 10px;font-weight:700;font-size:.9rem}
.chip b{font-family:var(--display);font-size:1rem}
.spd{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:2px 4px;font-size:.8rem}
.spd button{font:inherit;font-weight:700;border:0;background:none;color:var(--ink-soft);border-radius:7px;padding:3px 7px;cursor:pointer}
.spd button[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink)}
.proto{font-size:.72rem;color:var(--ink-soft);margin-left:auto}
.proto select{font:inherit;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:1px 4px}
/* zone de jeu : terrain et synergies */
.stage{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.play{min-height:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.field{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 10px;display:flex;flex-direction:column;gap:4px}
.side{display:grid;grid-template-columns:repeat(3,var(--s));gap:5px;justify-content:center}
.side-lbl{font-size:.68rem;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;display:flex;justify-content:space-between;gap:10px}
.sep{height:2px;background:repeating-linear-gradient(90deg,var(--line) 0 8px,transparent 8px 14px)}
.slot{position:relative;width:100%;aspect-ratio:1;border-radius:10px;border:2px dashed var(--line);background:var(--surface-2);cursor:pointer;min-width:0}
.slot.drop{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 16%,var(--surface-2))}
.slot .row-tag{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-size:.55rem;color:var(--ink-soft);opacity:.7}
/* places du terrain : libres (dorées, qui respirent) ou fermées tant que l'équipe est complète */
.slot.free{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 12%,var(--surface-2));animation:freeP 1.6s ease-in-out infinite}
@keyframes freeP{50%{background:color-mix(in srgb,var(--gold) 26%,var(--surface-2))}}
.slot.closed{opacity:.45;border-style:solid}
.slot-tag{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.72rem;color:var(--gold);pointer-events:none}
.slot.closed .slot-tag{color:var(--ink-soft);font-size:1rem}
.places{border-radius:999px;padding:1px 8px;background:var(--surface-2);text-transform:none;letter-spacing:0}
.places.free{background:var(--gold);color:var(--gold-ink);animation:freeB 1.6s ease-in-out infinite}
@keyframes freeB{50%{transform:scale(1.06)}}
.ip-st.cmp{grid-template-columns:40px 1fr 28px 34px}.ip-st .up{color:var(--ok);font-weight:800;text-align:right}.ip-st .dn{color:var(--danger);font-weight:800;text-align:right}
.ip-cmp{font-size:.72rem;margin:2px 0 0;color:var(--ink-soft)}
.unit{position:absolute;inset:0;border-radius:8px;background:linear-gradient(160deg,var(--c1),var(--c2));display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:2px;overflow:hidden;border:2px solid var(--rc);transition:transform .15s,opacity .3s}
.unit img{position:absolute;top:3%;left:12%;width:76%;height:64%;object-fit:contain;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.unit .un{position:relative;font-size:.58rem;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.7);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.unit .star{position:absolute;top:1px;left:3px;color:#ffe35a;font-size:.75rem;text-shadow:0 1px 2px #000}
.unit .cost{position:absolute;top:2px;right:3px;font-size:.58rem;font-weight:800;color:#fff;background:rgba(0,0,0,.35);border-radius:5px;padding:0 3px}
.unit .hp{position:relative;width:92%;height:5px;border-radius:4px;background:rgba(0,0,0,.45);margin-top:1px;overflow:hidden}
.unit .hp i{position:absolute;left:0;top:0;bottom:0;background:#5fd68f;transition:width .25s}
.unit.enemy .hp i{background:#ff6b81}
.unit.sel{outline:3px solid var(--gold);outline-offset:1px}
.unit.dead{opacity:.15;filter:grayscale(1)}
.unit.hit{animation:hit .3s}
.unit.act{transform:scale(1.08);z-index:2}
@keyframes hit{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.dmg{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-family:var(--display);font-weight:700;font-size:1rem;color:#fff;text-shadow:0 0 3px #000,0 1px 2px #000;pointer-events:none;animation:dmg .7s forwards;z-index:3;white-space:nowrap}
.dmg.sup{color:#ffe35a;font-size:1.15rem}.dmg.weak{color:#c9d0ff;font-size:.85rem}
@keyframes dmg{from{opacity:1;top:30%}to{opacity:0;top:-10%}}
.log{font-size:.82rem;min-height:1.2em;text-align:center;font-weight:700}
/* banc, boutique, actions */
.dock{display:flex;flex-direction:column;gap:6px;align-items:center;width:100%}
.lbl{font-size:.68rem;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;gap:8px;margin-bottom:3px}
.bench{display:grid;grid-template-columns:repeat(8,var(--b));gap:4px}
.shop{display:grid;grid-template-columns:repeat(5,var(--o));gap:5px}
.offer{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:3px 3px 4px;cursor:pointer;font:inherit;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.offer .pic{position:relative;width:100%;aspect-ratio:1.25;border-radius:8px;background:linear-gradient(160deg,var(--c1),var(--c2))}
.offer img{position:absolute;inset:4%;width:92%;height:92%;object-fit:contain}
.offer .on{font-size:.62rem;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.offer .oc{font-size:.68rem;font-weight:800;color:var(--rc)}
.offer .own3{position:absolute;top:3px;left:3px;font-size:.58rem;font-weight:800;background:var(--gold);color:var(--gold-ink);border-radius:5px;padding:0 4px}
.offer:disabled{opacity:.4;cursor:not-allowed}
.offer.empty{visibility:hidden}
.shop.locked{outline:2px solid var(--gold);outline-offset:3px;border-radius:12px}
.acts{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center}
.acts .fight{padding:10px 26px;font-size:1.05rem}
/* synergies : panneau sur le côté (grand écran), rangée de pastilles sous le terrain (téléphone) */
.synp{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;min-height:0;overflow:auto;display:none}
.synp h3{font-size:.95rem}
.sy{display:grid;grid-template-columns:74px auto 1fr;align-items:center;gap:7px;padding:4px 0;border-top:1px solid var(--line);font-size:.78rem}
.sy:first-of-type{border-top:0}
.sy-t{font-weight:700;border-radius:999px;padding:2px 6px;text-align:center;background:var(--surface-2);color:var(--ink-soft)}
.sy.on .sy-t{background:var(--t);color:#fff}
.sy-d{display:flex;gap:3px}.sy-d i{width:8px;height:8px;border-radius:50%;border:2px solid var(--t);opacity:.6}.sy-d i.f{background:var(--t);opacity:1}
.sy-e{font-weight:700}.sy:not(.on) .sy-e{font-weight:400;color:var(--ink-soft)}
.synl{display:flex;gap:5px;overflow-x:auto;max-width:100%;scrollbar-width:none;min-height:24px}
.synl span{flex:0 0 auto;border-radius:999px;padding:3px 9px;font-size:.72rem;font-weight:700;background:var(--surface-2);color:var(--ink-soft);border:1px solid var(--line)}
.synl span.on{color:#fff;background:var(--t);border-color:transparent}
/* téléphone et tablette : une colonne, cases calculées sur la hauteur restante */
@media (max-width:999px){:root{--s:clamp(40px,calc((100dvh - 470px) / 4),96px)}}
@media (max-width:599px){.wide{display:none}.top{gap:4px 6px}.top h1{display:none}.chip{padding:3px 7px;font-size:.8rem}.spd button{padding:3px 5px}.acts .fight{padding:9px 18px}}
/* grand écran (plan de Theo) : synergies à gauche, champ de bataille au centre avec le banc dessous, puis la boutique et
   les boutons ; à droite, la fiche du Pokémon choisi ou survolé */
@media (min-width:1000px){
  :root{--s:clamp(44px,calc((100dvh - 262px) / 5.75),108px);--b:min(calc(var(--s) * .86),96px);--o:min(calc(var(--s) * 1.05),116px)}
  .stage{grid-template-columns:250px minmax(0,1fr) 250px}
  .stage .synp{display:block;grid-column:1;grid-row:1}.stage .play{grid-column:2;grid-row:1}.stage .infop{display:block;grid-column:3;grid-row:1}
  .synl{display:none}
}
.infop{display:none;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;min-height:0;overflow:auto;font-size:.8rem}
.infop h3{font-size:.95rem}
.ip-art{position:relative;height:110px;border-radius:10px;background:linear-gradient(160deg,var(--c1),var(--c2));margin:6px 0}
.ip-art img{position:absolute;inset:6px;width:calc(100% - 12px);height:calc(100% - 12px);object-fit:contain}
.ip-tags{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}
.ip-tags span{border-radius:999px;padding:1px 8px;font-weight:700;color:#fff;background:var(--t);font-size:.72rem}
.ip-st{display:grid;grid-template-columns:44px 1fr 30px;gap:2px 6px;align-items:center;margin:6px 0}
.ip-st i{display:block;height:6px;border-radius:4px;background:linear-gradient(90deg,var(--c1),var(--c2))}
.ip-st .v{text-align:right;font-weight:700}
.ip-row{margin:5px 0}.ip-row b{display:block;font-size:.72rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em}
/* fenêtres : fin de partie, règles */
.overlay{position:fixed;inset:0;background:rgba(10,12,30,.7);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.overlay .card{background:var(--surface);border-radius:20px;padding:20px;max-width:460px;width:100%;max-height:calc(100dvh - 32px);overflow:auto}
.overlay h2{font-size:1.5rem;margin-bottom:8px}
.overlay li{margin:4px 0;font-size:.88rem}
</style>
</head>
<body>
<main id="app"><p class="muted">Chargement des Pokémon…</p></main>
<script>
/* ---------- données du jeu, lues dans index.html (Pokédex, types, évolutions, rééquilibrage des raretés) ---------- */
let DEX=[],EVO={},TYPES=[];
async function loadData(){
  const src=await (await fetch("../index.html")).text();
  const line=p=>{const i=src.indexOf("\n"+p);const j=src.indexOf("\n",i+1);return src.slice(i+1+p.length,j)};
  DEX=JSON.parse(line("const DEX=").replace(/;\s*$/,""));
  const e=line("const EVO=");EVO=JSON.parse(e.slice(0,e.indexOf("};")+1));
  const t=line("const TYPES=");TYPES=JSON.parse(t.slice(0,t.indexOf("];")+1));
  const m=src.match(/const RAR_FIX=(\{[\s\S]*?\});/);if(m){const f=Function("return "+m[1])();for(const r in f)f[r].forEach(id=>DEX[id-1][7]=+r)}
}
const D=id=>DEX[id-1];
const RC={0:"var(--r0)",1:"var(--r1)",2:"var(--r2)",3:"var(--r3)",5:"var(--r5)"};
const COST={0:1,1:2,2:3,3:4,5:5};
const RARN={0:"Commune",1:"Peu commune",2:"Rare",3:"Épique",5:"Légendaire"};
const img=id=>`../images/${id}.webp`;
const evoOf=id=>(EVO[id]||[]).filter(x=>x<=1025);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- table des types (attaquant → défenseur), numéros de TYPES ---------- */
const CHART={1:{6:.5,9:.5,8:0},2:{1:2,6:2,9:2,15:2,17:2,3:.5,4:.5,7:.5,14:.5,18:.5,8:0},3:{2:2,7:2,12:2,6:.5,9:.5,13:.5},
  4:{12:2,18:2,4:.5,5:.5,6:.5,8:.5,9:0},5:{4:2,6:2,9:2,10:2,13:2,7:.5,12:.5,3:0},6:{3:2,7:2,10:2,15:2,2:.5,5:.5,9:.5},
  7:{12:2,14:2,17:2,2:.5,3:.5,4:.5,8:.5,9:.5,10:.5,18:.5},8:{8:2,14:2,17:.5,1:0},9:{6:2,15:2,18:2,9:.5,10:.5,11:.5,13:.5},
  10:{7:2,9:2,12:2,15:2,6:.5,10:.5,11:.5,16:.5},11:{5:2,6:2,10:2,11:.5,12:.5,16:.5},12:{5:2,6:2,11:2,3:.5,4:.5,7:.5,9:.5,10:.5,12:.5,16:.5},
  13:{3:2,11:2,13:.5,12:.5,16:.5,5:0},14:{2:2,4:2,9:.5,14:.5,17:0},15:{3:2,5:2,12:2,16:2,9:.5,10:.5,11:.5,15:.5},
  16:{16:2,9:.5,18:0},17:{8:2,14:2,2:.5,17:.5,18:.5},18:{2:2,16:2,17:2,4:.5,9:.5,10:.5}};
// l'attaquant frappe avec le meilleur de ses types ; le multiplicateur se cumule sur les deux types du défenseur
const typeMult=(a,d)=>Math.max(...D(a)[3].map(at=>D(d)[3].reduce((m,dt)=>m*((CHART[at]||{})[dt]??1),1)));

/* ---------- règles de la partie (à régler) ---------- */
const ROUNDS=10,LIVES=3,LOSS_GOLD=3,BENCH=8,REROLL=2,DAILY_CAP=3000; // 3 vies par partie ; une manche perdue coûte une vie et donne 3 or pour se relancer
const teamMax=r=>Math.min(6,3+Math.floor((r-1)/2));              // 3 Pokémon en manche 1, puis un de plus toutes les 2 manches
const income=r=>6+Math.floor(r/2);                                   // or reçu au début de chaque manche : 6 en manche 1 … 11 en manche 10 (+1 si victoire, + intérêts)
const winCredits=r=>60+20*r, FINISH_BONUS=400;                      // crédits (fictifs) : par manche gagnée, et en finissant les 10 manches
// chances de rareté dans la boutique selon la manche : Commune, Peu commune, Rare, Épique, Légendaire
const SHOP_ODDS=r=>r<=2?[75,25,0,0,0]:r<=4?[50,35,15,0,0]:r<=6?[30,35,25,10,0]:r<=8?[20,30,30,17,3]:[15,25,30,22,8];
const RARS=[0,1,2,3,5];

/* ---------- collection simulée (dans le vrai jeu : la collection du joueur) ---------- */
const COLL_P={petite:{0:.45,1:.25,2:.12,3:.05,5:.02},moyenne:{0:.8,1:.6,2:.4,3:.25,5:.1},grande:{0:.98,1:.95,2:.85,3:.7,5:.4}};
let collSize=new URLSearchParams(location.search).get("coll")||"moyenne",OWNED=[];
function makeCollection(){OWNED=DEX.map((d,i)=>i+1).filter(id=>Math.random()<COLL_P[collSize][D(id)[7]])}

/* ---------- état de la partie ---------- */
let G=null,sel=null,fighting=false,uidN=0,creditsDay=0;
let speed=(()=>{try{return +localStorage.getItem("arene-speed")||1}catch(e){return 1}})(); // vitesse des combats choisie par le joueur (×1, ×2, ×4, instantanée = 9)
function newGame(){
  G={round:1,hp:LIVES,gold:6,wins:0,credits:0,board:Array(6).fill(null),bench:Array(BENCH).fill(null),shop:[],locked:false,enemy:null,over:false,msg:""};
  sel=null;G.enemy=makeEnemy(1);rollShop(true);
}
const pick=a=>a[Math.floor(Math.random()*a.length)];
function rollRar(r,pool){ // rareté tirée selon la manche, parmi celles qui ont au moins un Pokémon
  const o=SHOP_ODDS(r).map((w,i)=>pool(RARS[i]).length?w:0),s=o.reduce((a,b)=>a+b,0);if(!s)return 0;
  let x=Math.random()*s;for(let i=0;i<5;i++){if(x<o[i])return RARS[i];x-=o[i]}return 0;
}
/* Boutique orientée par l'équipe : chaque case a une chance fixe de reproposer un Pokémon qu'on a déjà (pour réunir les
   3 exemplaires, même avec une grande collection), et les Pokémon des types qu'on joue sortent plus souvent (poids
   proportionnel à la taille de la réserve : avec 150 Communes et 2 Pokémon Feu dans l'équipe, un Feu pèse 6 fois plus). */
const SHOP_BOOST={slot:.25,type:1/60};
function shopWeight(k){
  const types={};for(const u of allUnits())for(const t of D(u.id)[3])types[t]=(types[t]||0)+1;
  const wType=Math.max(.3,k*SHOP_BOOST.type);
  return id=>1+Math.min(6,D(id)[3].reduce((a,t)=>a+(types[t]||0),0))*wType;
}
function pickWeighted(l,w){const ws=l.map(w),s=ws.reduce((a,b)=>a+b,0);let x=Math.random()*s;for(let i=0;i<l.length;i++){if(x<ws[i])return l[i];x-=ws[i]}return l[l.length-1]}
function rollShop(free){
  if(!free){if(G.gold<REROLL)return;G.gold-=REROLL}
  const pool=r=>OWNED.filter(id=>D(id)[7]===r);
  const mine=allUnits().filter(u=>!u.star&&OWNED.includes(u.id)).map(u=>u.id); // un exemplaire = une chance (2 exemplaires : deux fois plus)
  G.shop=Array.from({length:5},()=>{
    if(mine.length&&Math.random()<SHOP_BOOST.slot)return pick(mine); // case « déjà dans l'équipe » : pour réunir les 3 exemplaires, quelle que soit la collection
    const r=rollRar(G.round,pool),l=pool(r);return l.length?pickWeighted(l,shopWeight(l.length)):null});
  render();
}
const unitCost=u=>COST[D(u.id)[7]]*(u.star?3:1);
const allUnits=()=>[...G.board,...G.bench].filter(Boolean);
function buy(i){
  const id=G.shop[i];if(!id||fighting)return;const c=COST[D(id)[7]];
  if(G.gold<c){flash("Pas assez d’or.");return}
  const same=allUnits().filter(u=>u.id===id&&!u.star).length;
  const free=G.bench.indexOf(null);if(free<0&&same<2){flash("Votre banc est plein.");return}
  G.gold-=c;G.shop[i]=null;
  if(free>=0)G.bench[free]={uid:++uidN,id,star:0};else G.bench.push({uid:++uidN,id,star:0});
  merge(id);G.bench=G.bench.slice(0,BENCH);render();
}
/* 3 exemplaires du même Pokémon : ils évoluent (évolution au hasard s'il y en a plusieurs) ; en fin de lignée, il gagne une étoile */
function merge(id){
  const same=allUnits().filter(u=>u.id===id&&!u.star);if(same.length<3)return;
  const keep=same.find(u=>G.board.includes(u))||same[0],evo=evoOf(id);
  same.filter(u=>u!==keep).slice(0,2).forEach(u=>{let k=G.board.indexOf(u);if(k>=0)G.board[k]=null;k=G.bench.indexOf(u);if(k>=0)G.bench[k]=null});
  if(evo.length){keep.id=pick(evo);flash(`✨ ${D(id)[0]} évolue en ${D(keep.id)[0]} !`);merge(keep.id)}
  else{keep.star=1;flash(`⭐ ${D(id)[0]} passe à une étoile !`)}
}
function sell(){
  if(!sel||fighting)return;const u=sel;G.gold+=unitCost(u);
  let k=G.board.indexOf(u);if(k>=0)G.board[k]=null;k=G.bench.indexOf(u);if(k>=0)G.bench[k]=null;sel=null;render();
}
function clickSlot(zone,i){
  if(fighting||G.over)return;const arr=zone==="board"?G.board:G.bench,u=arr[i];
  if(!sel){if(u){sel=u;render()}return}
  if(u===sel){sel=null;render();return}
  const from=G.board.includes(sel)?G.board:G.bench,fi=from.indexOf(sel);
  if(zone==="board"&&from!==G.board&&!u&&G.board.filter(Boolean).length>=teamMax(G.round)){flash(`${teamMax(G.round)} Pokémon au plus sur le terrain pour cette manche.`);return}
  from[fi]=u||null;arr[i]=sel;sel=null;render();
}

/* ---------- synergies de types : 2 Pokémon différents d'un type = +15 % PV et Attaque pour ce type, 4 = +30 % ---------- */
function synergies(units){
  const c={};for(const id of new Set(units.map(u=>u.id)))for(const t of D(id)[3])c[t]=(c[t]||0)+1;
  return c;
}
const synBonus=n=>n>=4?.3:n>=2?.15:0;

/* ---------- équipe de l'ordinateur ---------- */
let BASES=null;
const AI={evo:.04,pow0:.65,powK:.03}; // difficulté de l’ordinateur : chance d’évolution par manche, puissance de départ et gain par manche
function makeEnemy(r){
  if(!BASES){const ev=new Set(Object.values(EVO).flat());BASES=DEX.map((d,i)=>i+1).filter(id=>!ev.has(id))} // Pokémon de base (issus d’aucune évolution)
  const n=teamMax(r),team=[],pool=x=>BASES.filter(id=>D(id)[7]===x);
  for(let k=0;k<n;k++){
    let id=pick(pool(rollRar(r+1,pool)));
    for(let e=0;e<2;e++)if(Math.random()<Math.min(.8,AI.evo*r)){const ev=evoOf(id);if(ev.length)id=pick(ev)}
    team.push({uid:++uidN,id,star:r>=7&&Math.random()<.08*(r-6)?1:0});
  }
  const board=Array(6).fill(null);
  team.sort((a,b)=>D(b.id)[6][2]-D(a.id)[6][2]).forEach((u,k)=>board[k<3?k:k]=u); // les plus résistants devant
  return {board,power:AI.pow0+AI.powK*r};
}

/* ---------- combat automatique (dans le vrai jeu : simulé par le serveur, la page ne fait que l'animer) ---------- */
function fighter(u,side,pos,syn,power){
  const [pv,atk,def,as,ds,vit]=D(u.id)[6],b=Math.max(...D(u.id)[3].map(t=>synBonus(syn[t]||0))),s=u.star?1.6:1;
  return {u,side,pos,row:pos<3?0:1,col:pos%3,maxhp:Math.round((2*pv+60)*s*(1+b)*power),atk:Math.max(atk,as)*s*(1+b)*power,def:(def+ds)/2,spd:vit,hp:0};
}
function simulate(mine,enemy){
  const sm=synergies(mine.filter(Boolean)),se=synergies(enemy.board.filter(Boolean));
  const F=[...mine.map((u,i)=>u&&fighter(u,"me",i,sm,1)),...enemy.board.map((u,i)=>u&&fighter(u,"ai",i,se,enemy.power))].filter(Boolean);
  F.forEach(f=>f.hp=f.maxhp);
  const log=[];let tick=0;
  const alive=s=>F.filter(f=>f.side===s&&f.hp>0);
  while(alive("me").length&&alive("ai").length&&tick<40){
    tick++;
    const order=F.filter(f=>f.hp>0).sort((a,b)=>b.spd-a.spd||Math.random()-.5);
    for(const a of order){
      if(a.hp<=0)continue;const foes=alive(a.side==="me"?"ai":"me");if(!foes.length)break;
      const front=foes.filter(f=>f.row===0),targets=front.length?front:foes;
      const t=targets.sort((x,y)=>Math.abs(x.col-a.col)-Math.abs(y.col-a.col)||x.hp-y.hp)[0];
      const m=typeMult(a.u.id,t.u.id),dmg=m===0?0:Math.max(3,Math.round(a.atk*a.atk/(a.atk+t.def)*.45*m*(.9+Math.random()*.2)));
      t.hp=Math.max(0,t.hp-dmg);log.push({a:a.u.uid,t:t.u.uid,dmg,m,hp:t.hp,max:t.maxhp});
    }
  }
  let win=alive("me").length>0&&!alive("ai").length;
  if(alive("me").length&&alive("ai").length){const pct=s=>F.filter(f=>f.side===s).reduce((x,f)=>x+f.hp/f.maxhp,0);win=pct("me")>pct("ai")}
  return {log,win,left:win?0:alive("ai").length,max:Object.fromEntries(F.map(f=>[f.u.uid,f.maxhp]))};
}
/* Avant le combat : chaque place libre du terrain reçoit le Pokémon le plus fort du banc (total de ses statistiques),
   d'abord devant, puis derrière */
function autoPlace(){
  const placed=[],pw=u=>D(u.id)[6].reduce((a,b)=>a+b,0)*(u.star?1.6:1);
  while(G.board.filter(Boolean).length<teamMax(G.round)){
    const b=G.bench.filter(Boolean).sort((x,y)=>pw(y)-pw(x))[0];if(!b)break;
    const slot=G.board.indexOf(null);G.board[slot]=b;G.bench[G.bench.indexOf(b)]=null;placed.push(D(b.id)[0]);
  }
  if(placed.length){G.msg=G.auto=`Placé${placed.length>1?"s":""} d’office : ${placed.join(", ")}.`;render()}
}
async function fight(){
  if(fighting||G.over)return;
  autoPlace(); // places libres sur le terrain : remplies d'office avec les Pokémon du banc (au cas où le joueur oublie)
  if(!G.board.some(Boolean)){flash("Placez au moins un Pokémon sur le terrain.");return}
  fighting=true;sel=null;render();
  const res=simulate(G.board,G.enemy);
  document.querySelectorAll(".unit").forEach(el=>{const m=res.max[el.dataset.uid];if(m)el.dataset.max=m});
  for(const ev of res.log){
    if(!fighting)break;
    const a=document.querySelector(`.unit[data-uid="${ev.a}"]`),t=document.querySelector(`.unit[data-uid="${ev.t}"]`);
    if(speed<9){a&&a.classList.add("act");await sleep(140/speed)}
    if(t){const bar=t.querySelector(".hp i");if(bar)bar.style.width=Math.max(0,ev.hp*100/ev.max)+"%";
      if(speed<9){t.classList.remove("hit");void t.offsetWidth;t.classList.add("hit");
        const n=document.createElement("span");n.className="dmg"+(ev.m>1?" sup":ev.m<1?" weak":"");n.textContent=ev.m===0?"Aucun effet":ev.m>1?`${ev.dmg} !`:ev.dmg;t.parentElement.append(n);setTimeout(()=>n.remove(),700)}
      if(ev.hp<=0)t.classList.add("dead")}
    if(speed<9){await sleep(260/speed);a&&a.classList.remove("act")}
  }
  await sleep(400);
  endRound(res);
}
function endRound(res){
  fighting=false;const r=G.round;
  if(res.win){G.wins++;const c=Math.min(winCredits(r),DAILY_CAP-creditsDay);G.credits+=c;creditsDay+=c;G.gold+=1;G.msg=`Manche ${r} gagnée ! +${c} crédits.`}
  else{G.hp=Math.max(0,G.hp-1);G.gold+=LOSS_GOLD;G.msg=G.hp>0?`Manche ${r} perdue : −1 vie. +${LOSS_GOLD} or pour vous relancer.`:`Manche ${r} perdue : plus de vies.`}
  if(G.auto){G.msg=G.auto+" "+G.msg;G.auto=""} // rappel des Pokémon placés d'office
  if(G.hp<=0||r>=ROUNDS){
    G.over=true;let bonus=0;if(G.hp>0){bonus=Math.min(FINISH_BONUS,DAILY_CAP-creditsDay);G.credits+=bonus;creditsDay+=bonus}
    showEnd(G.hp>0,bonus);render();return;
  }
  G.round++;G.gold+=income(G.round)+Math.min(3,Math.floor(G.gold/10));
  G.enemy=makeEnemy(G.round);if(G.locked)render();else rollShop(true); // boutique verrouillée : gardée pour la manche suivante
}
function showEnd(ok,bonus){
  const o=document.createElement("div");o.className="overlay";
  o.innerHTML=`<div class="card"><h2>${ok?"🏆 Arène terminée !":"💥 Défaite"}</h2>
    <p>${ok?`Vous avez tenu les ${ROUNDS} manches, avec ${G.hp} vie${G.hp>1?"s":""} restante${G.hp>1?"s":""}.`:`Plus de vies à la manche ${G.round}.`}<br>${G.wins} manche${G.wins>1?"s":""} gagnée${G.wins>1?"s":""}. Les crédits gagnés pendant la partie sont à vous.</p>
    <p style="font-size:1.3rem"><b>+${G.credits} crédits</b>${bonus?` <span class="muted">(dont ${bonus} de bonus final)</span>`:""}</p>
    <p class="muted" style="font-size:.85rem">Aujourd’hui : ${creditsDay} / ${DAILY_CAP} crédits (fictifs).</p>
    <button class="btn primary" onclick="this.closest('.overlay').remove();newGame()">Rejouer</button></div>`;
  document.body.append(o);
}

  ({buy:()=>buy(+b.dataset.i),reroll:()=>rollShop(false),fight,sell,rules:showRules,
    lock:()=>{G.locked=!G.locked;render()},
    speed:()=>{speed=+b.dataset.v;try{localStorage.setItem("arene-speed",speed)}catch(err){}document.querySelectorAll('[data-act="speed"]').forEach(x=>x.setAttribute("aria-pressed",+x.dataset.v===speed))}, // sans tout redessiner : possible pendant un combat
    new:()=>{fighting=false;newGame()}})[b.dataset.act]();
});
document.addEventListener("change",e=>{
  if(e.target.id==="coll"){collSize=e.target.value;makeCollection();fighting=false;newGame()}
});
loadData().then(()=>{makeCollection();newGame()}).catch(err=>{document.getElementById("app").innerHTML=`<p>Impossible de lire les données du jeu (${esc(err.message)}). Ouvrez la maquette par le serveur local (outils/serveur-local.ps1).</p>`});
</script>
</body>
</html>

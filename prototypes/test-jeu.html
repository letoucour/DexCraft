<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Test DexCraft (local)</title>
<style>html,body{margin:0;height:100%;background:#000}iframe{border:0;width:100%;height:100%}</style></head>
<body><iframe id="f" src="../index.html?test-local" allow="clipboard-write; clipboard-read"></iframe>
<script>
/* Page de test LOCALE (jamais publiée) : charge le jeu et remplace le serveur par un faux, pour faire des captures
   d'écran sans compte. ?scene=shop|look|booster|ranking|buy|unlock|trades */
const scene=new URLSearchParams(location.search).get("scene")||"shop";
const f=document.getElementById("f");
f.onload=()=>setTimeout(()=>{const w=f.contentWindow;try{const s=w.document.createElement("script");s.textContent=`try{(${setup})(${JSON.stringify(scene)})}catch(e){document.title="ERREUR "+e.message}`;w.document.body.append(s)}catch(e){document.body.insertAdjacentHTML("afterbegin",`<pre style="position:fixed;z-index:9;color:#f55;background:#000;padding:8px">${e.stack}</pre>`)}},5000);
function setup(scene){
  const stamp=d=>{const l=d.look||{};const vis={};if(l.cadre&&(d.cos||{})[l.cadre])vis.f=l.cadre;if(l.pseudo&&(d.cos||{})[l.pseudo])vis.p=l.pseudo;const b=Object.keys(d.cos||{}).filter(k=>k.startsWith("badge.")).sort();if(b.length)vis.b=b;d.vis=vis;d.updated=(d.updated||0)+1;return d};
  const rpcMock=async(n,a)=>{const d=clone(S);
    if(n==="dc_set_look"){d.look=d.look||{};if(a.p_item)d.look[a.p_slot]=a.p_item;else delete d.look[a.p_slot];return {data:{profile:stamp(d)},error:null}}
    if(n==="dc_admin_give_offer"){d.cos=d.cos||{};OFFER_BY[a.p_offer].items.forEach(i=>d.cos[i]=Date.now());d.unlock={o:a.p_offer,t:Date.now()};return {data:{profile:stamp(d)},error:null}}
    if(n==="dc_set_vitrine"){d.vitrine=a.p_slots;return {data:{profile:stamp(d)},error:null}}
    if(n==="dc_shiny_view"){if(a.p_id==null)d.shinyNorm=!d.shinyNorm;else{d.shinyOff=d.shinyOff||{};if(d.shinyOff[a.p_id])delete d.shinyOff[a.p_id];else d.shinyOff[a.p_id]=1}return {data:{profile:stamp(d)},error:null}}
    if(n==="dc_secret_cards")return {data:{ids:{6:[],7:[]},cards:{}},error:null};
    // Arène : faux serveur minimal (la vraie logique est dans dexcraft-serveur-5.sql)
    if(/^dc_ar_/.test(n)){const W=window;let A=W.__ar;const U=(i,s=0)=>({u:++W.__arN,i,s});W.__arN=W.__arN||100;
      const shop=()=>[1,4,7,25,133].map(x=>x+Math.floor(Math.random()*3));
      const view=()=>({data:{run:A,gained:W.__arG||0,cap:3000},error:null});
      const lay=()=>{if(a.p_board){const all=[...A.board,...A.bench].filter(Boolean),f=x=>x==null?null:all.find(u=>u.u===x);A.board=a.p_board.map(f);A.bench=a.p_bench.map(f)}};
      if(n==="dc_ar_state")return view();
      if(n==="dc_ar_start"){A=W.__ar={round:1,hp:3,gold:6,wins:0,credits:0,locked:false,over:false,board:Array(6).fill(null),bench:[U(4),U(7),null,null,null,null,null,null,null],shop:shop(),enemy:{board:[U(19),U(16),U(10),null,null,null],power:.7}};return view()}
      lay();
      if(n==="dc_ar_buy"){const id=A.shop[a.p_slot];A.gold-=AR.cost[rar(id)];A.shop[a.p_slot]=null;A.bench[A.bench.indexOf(null)]=U(id);return view()}
      if(n==="dc_ar_sell"){["board","bench"].forEach(z=>A[z]=A[z].map(u=>u&&u.u===a.p_u?(A.gold+=AR.cost[rar(u.i)],null):u));return view()}
      if(n==="dc_ar_reroll"){A.gold-=2;A.shop=shop();return view()}
      if(n==="dc_ar_lock"){A.locked=a.p_on;return view()}
      if(n==="dc_ar_layout")return {data:{ok:true},error:null};
      if(n==="dc_ar_next"){if(A.pshop){delete A.pshop;if(!A.locked)A.shop=shop();else A.locked=false}return view()}
      if(n==="dc_ar_fight"){const before={board:A.board.map(x=>x),bench:A.bench.map(x=>x),enemy:A.enemy};const mine=A.board.filter(Boolean),en=A.enemy.board.filter(Boolean),log=[];
        const hp={};[...mine,...en].forEach(u=>hp[u.u]=100);for(let k=0;k<12;k++){const a1=mine[k%mine.length],t=en[k%en.length];if(!a1||!t)break;hp[t.u]=Math.max(0,hp[t.u]-40);log.push([a1.u,t.u,40,k%3?1:2,hp[t.u],100])}
        const r=A.round;A.wins++;A.credits+=80;W.__arG=(W.__arG||0)+80;A.round++;A.gold+=7;A.enemy={board:[U(21),U(23),U(27),null,null,null],power:.7};A.pshop=true; // 1.5.15 : boutique changée à la fin (dc_ar_next)
        return {data:Object.assign(view().data,{before,log,win:true,added:80,bonus:0,auto:[],round:r,profile:stamp(d)}),error:null}}
    }
    // Souterrain : faux serveur (même logique que dexcraft-serveur-6.sql) ; ?scene=sout
    if(/^dc_sout_/.test(n)){const W=window,A=SOUT,R=k=>Math.floor(Math.random()*k);
      const vw=(st,p)=>{if(!st)return {run:null,sout:(p||S).sout||{}};const r=st.d.map((dd,i)=>dd>0?null:st.o[i]===-1?0:st.o[i]===-2?"f":(o=>[o.k,i%st.w-o.x,Math.floor(i/st.w)-o.y,st.o[i]])(st.objs[st.o[i]]));
        return {run:{w:st.w,h:st.h,hp:st.hp,hp0:st.hp0,n:st.objs.length,d:st.d.slice(),r,over:st.over,end:st.end,res:st.res,objs:st.objs.map((o,i)=>({...o,i})).filter(o=>st.over||o.done)},sout:(p||S).sout||{}}};
      if(n==="dc_sout_state")return {data:vw(W.__so),error:null};
      if(n==="dc_sout_start"){if(!W.__so||W.__so.over){const w=13,h=10,dd=Array(w*h).fill(A.base),oo=Array(w*h).fill(-1),objs=[];
          for(let k=0;k<A.plaq;k++){const cx=R(w),cy=R(h),rr=1+R(3);for(let y=0;y<h;y++)for(let x=0;x<w;x++)if((x-cx)**2+(y-cy)**2<=rr*rr)dd[y*w+x]=Math.min(6,dd[y*w+x]+1)}
          const tot=SO_ORDER.reduce((s,k)=>s+A.items[k].w,0),nb=A.n[0]+R(A.n[1]-A.n[0]+1),ni=A.irons[0]+R(A.irons[1]-A.irons[0]+1);
          for(let i=0;i<nb+ni;i++){let key=null,ow,oh;if(i<nb){let r=R(tot);for(const k of [...SO_ORDER].sort()){r-=A.items[k].w;if(r<0){key=k;[ow,oh]=A.items[k].s;break}}}else[ow,oh]=[[1,1],[2,1],[1,2],[2,2],[3,1]][R(5)];
            for(let t=0;t<200;t++){const x=R(w-ow+1),y=R(h-oh+1);let ok=true;for(let j=0;j<ow*oh;j++)if(oo[(y+Math.floor(j/ow))*w+x+j%ow]!==-1){ok=false;break}
              if(ok){for(let j=0;j<ow*oh;j++)oo[(y+Math.floor(j/ow))*w+x+j%ow]=key?objs.length:-2;if(key)objs.push({k:key,x,y,w:ow,h:oh,done:false});break}}}
          W.__so={w,h,d:dd,o:oo,objs,hp:A.hp,hp0:A.hp,over:false,ir:0};d.credits-=A.cost}
        return {data:Object.assign(vw(W.__so,d),{profile:stamp(d)}),error:null}}
      if(n==="dc_sout_hit"){const st=W.__so;if(!st||st.over)return {data:null,error:{message:"Aucune fouille en cours."}};
        const c=a.p_y*st.w+a.p_x,iron=st.o[c]===-2,dmg=(a.p_tool==="h"?A.hammer:A.pick)*(iron?2:1),fresh=[];st.d[c]-=2;
        if(a.p_tool==="h")[[-1,0],[1,0],[0,-1],[0,1]].forEach(([x,y])=>{const X=a.p_x+x,Y=a.p_y+y;if(X>=0&&Y>=0&&X<st.w&&Y<st.h)st.d[Y*st.w+X]-=1});
        let all=true;st.objs.forEach((o,i)=>{if(o.done)return;let ok=true;for(let j=0;j<o.w*o.h;j++)if(st.d[(o.y+Math.floor(j/o.w))*st.w+o.x+j%o.w]>0)ok=false;if(ok){o.done=true;fresh.push(i)}else all=false});
        st.hp=Math.max(0,st.hp-dmg);if(iron)st.ir++;
        await new Promise(r=>setTimeout(r,90)); // délai du réseau
        if(st.hp<=0||all){st.over=true;st.end=all?"all":"wall";const res={ec:0,cr:0,items:[]};d.sout=d.sout||{ec:0,got:{}};d.sout.got=d.sout.got||{};
          st.objs.filter(o=>o.done).forEach(o=>{const it=A.items[o.k];res.items.push(o.k);res.ec+=it.v||0;res.cr+=it.cr||0;d.sout.got[o.k]=(d.sout.got[o.k]||0)+1});
          d.sout.ec=(d.sout.ec||0)+res.ec;d.credits+=res.cr;st.res=res;return {data:Object.assign(vw(st,d),{profile:stamp(d),iron,fresh,dmg}),error:null}}
        const v=vw(st);delete v.sout;return {data:Object.assign(v,{iron,fresh,dmg}),error:null}}
      if(n==="dc_sout_buy"){const l=A.lots.find(x=>x.k===a.p_lot);d.sout=d.sout||{};if((d.sout.ec||0)<l.p)return {data:null,error:{message:`Il vous manque ${l.p-(d.sout.ec||0)} éclats.`}};
        d.sout.ec-=l.p;if(l.packs)d.bonus=(d.bonus||0)+l.packs;else{const k=spKey(l.sp,a.p_val);d.spInv=d.spInv||{};d.spInv[k]=(d.spInv[k]||0)+1}return {data:{profile:stamp(d)},error:null}}
    }
    if(n==="dc_buy_special"){const k=spKey(a.p_kind,a.p_val);d.spInv=d.spInv||{};d.spInv[k]=(d.spInv[k]||0)+a.p_q;return {data:{profile:stamp(d)},error:null}}
    if(n==="dc_open_special"){const k=spKey(a.p_kind,a.p_val);d.spInv=d.spInv||{};d.spInv[k]=(d.spInv[k]||0)-a.p_k;if(d.spInv[k]<=0)delete d.spInv[k];
      const l=a.p_kind==="prem"?DEX_ORDER.filter(id=>rar(id)>=2):spList(a.p_kind,a.p_val),drawn=Array.from({length:5*a.p_k},()=>({id:l[Math.floor(Math.random()*l.length)],isNew:true}));
      drawn.forEach(c=>d.coll[c.id]=(d.coll[c.id]||0)+1);d.lastOpen={t:Date.now(),drawn};return {data:{profile:stamp(d),drawn},error:null}}
    if(/^dc_trade_(create|create_many|bulk)$/.test(n)){window.__last={n,a};return {data:{profile:stamp(d),mid:"m1",n:2,nolist:[4]},error:null}}
    if(n==="dc_vb_state")return {data:{profile:stamp(d),vb:{level:3,score:0,state:"play",rows:[[5,1],[6,0],[4,2],[7,1],[5,1]],cols:[[5,1],[6,1],[5,1],[6,1],[5,1]],vals:Array(25).fill(null),opened:Array(25).fill(false)}},error:null};
    return {data:null,error:{message:"?"}}};
  SB={auth:{},functions:{invoke:async()=>({data:{url:"#"},error:null})},from:()=>({select(){return this},eq(){return this},order(){return this},in(){return Promise.resolve({data:[],error:null})},range(){return Promise.resolve({data:[],error:null})},maybeSingle(){return Promise.resolve({data:null,error:null})}}),rpc:rpcMock,channel:()=>({on(){return this},subscribe(){}})};
  mode="online";ME="me";OWNER=true;
  const all=Object.keys(COS).reduce((o,k)=>(o[k]=1,o),{});
  const rich=scene!=="shop"&&scene!=="buy"&&scene!=="packs";
  S=norm({pseudo:"Theo",alpha:true,beta:true,pseudoSet:true,avatar:25,coll:{25:2,6:1,129:1,1:3,4:2,7:1,150:1,4007:1},updated:1,stats:{packs:40},tips:{a:1,b:1,c:1,d:1},credits:4500,
    cos:rich?all:{"dos.braise":1,"sac.volcan":1,"cadre.flammes":1,"pseudo.magma":1,"fond.volcan":1},
    look:{dos:"dos.diamant",sac:"sac.lingot",cadre:"cadre.solitaire",pseudo:"pseudo.platine",fond:"fond."+(new URLSearchParams(parent.location.search).get("fond")||"palais")}});
  stamp(S);
  PLAYERS={me:{pseudo:"Theo",alpha:true,beta:true,avatar:25,unique:900,byr:[300,200,150,100,60,40,0,0],vis:S.vis,shown:["lord"]},
    a:{pseudo:"Sacha",beta:true,avatar:6,unique:950,byr:[320,210,160,110,70,50,0,0],vis:{f:"cadre.flammes",p:"pseudo.magma",b:["badge.soutien"]}},
    b:{pseudo:"Ondine",avatar:131,unique:800,byr:[280,190,140,90,50,20,0,0],vis:{f:"cadre.marine",p:"pseudo.corail"}},
    c:{pseudo:"Pierre",avatar:95,unique:700,byr:[260,170,120,80,40,10,0,0]}};
  showGate(false);if(new URLSearchParams(parent.location.search).get("theme"))document.documentElement.dataset.theme=new URLSearchParams(parent.location.search).get("theme");
  if(scene==="shop"||scene==="buy"||scene==="packs"){view="shop";renderAll();if(scene==="buy")buyOffer("cosmos");if(scene==="packs")setTimeout(()=>document.querySelectorAll("#app h2")[2].scrollIntoView(),50)}
  if(scene==="look"){profOpen.look=true;view="profile";renderAll();setTimeout(()=>document.querySelector('[data-sec="look"]').scrollIntoView(),50)}
  if(scene==="arena"){if(new URLSearchParams(parent.location.search).get("run")){localStorage.setItem("dc-mute","1");window.__arN=200;window.__ar={round:3,hp:2,gold:23,wins:1,credits:100,hist:[1,0],locked:false,over:false,board:[{u:101,i:4,s:0},{u:102,i:58,s:0},{u:103,i:25,s:2},{u:104,i:1,s:0},null,null],bench:[{u:105,i:133,s:0},{u:106,i:4,s:0},null,null,null,null,null,null,null],shop:[6,9,26,134,94],enemy:{board:[{u:111,i:19,s:0},{u:112,i:16,s:0},{u:113,i:10,s:0},{u:114,i:74,s:0},{u:115,i:21,s:0},null,null],power:.7}}} // ?run=1 : partie en cours, pour les captures (1.3.14)
    view="arena";renderAll()}
  if(scene==="booster"){view="booster";if(new URLSearchParams(parent.location.search).get("inv"))S.spInv={prem:2,"gen:1":3,"type:10":1,"type:16":12};renderAll()}
  if(scene==="special"){OWNER=false;S.credits=12500;view="shop";renderAll();setTimeout(()=>{const h=document.querySelector("#shop-special");window.scrollTo(0,h.getBoundingClientRect().top+scrollY-70)},50)}
  if(scene==="hand"){view="booster";reveal=[1,4,7,25,6].map(id=>({id,isNew:false,shown:false}));renderAll()}
  if(scene==="ranking"){view="ranking";renderAll()}
  if(scene==="volto"){view="volto";renderAll()}
  if(scene==="sout"){localStorage.setItem("dc-mute","1");S.dev=true;S.sout={ec:640,got:{pb:5,gb:2,pr:3,or:4,pv:1}};view="sout";renderAll()} // Souterrain (1.5.9), mode développeur
  if(scene==="coll"){view="collection";renderAll()}
  if(scene==="shiny"){S.shiny={25:Date.now()-864e5,6:Date.now(),4007:Date.now()};S.got={25:14,6:3,1:40,4:2,7:1,129:1,150:1,4007:1};S.shinyN=3;S.stats.shinyN=3;S.avaS=true;PLAYERS.me.shinyN=3;PLAYERS.me.avaS=true;PLAYERS.a.shinyN=420;PLAYERS.b.shinyN=60;Object.values(PLAYERS).forEach(p=>p.byrV=BYR_V);view=new URLSearchParams(parent.location.search).get("v")||"collection";renderAll()}
  if(scene==="shinyhand"){S.got={25:14};view="booster";reveal=[1,25,7,150,6].map(id=>({id,isNew:false,shiny:id===25||id===150,shown:false}));renderAll()}
  if(scene==="share"){view="collection";renderAll();shareCard(+(new URLSearchParams(parent.location.search).get("id")||25))}
  if(scene==="legend"){view="booster";renderAll();legendFx(150)}
  if(scene==="look2"){S.cos={"dos.braise":1,"sac.volcan":1,"cadre.flammes":1,"pseudo.magma":1,"fond.volcan":1,"badge.soutien":1};S.look={dos:"dos.braise"};profOpen.look=true;view="profile";renderAll();setTimeout(()=>document.querySelector(`[data-sec="look"]`).scrollIntoView(),50)}
  if(scene==="wantpick"){view="collection";renderAll();S.wish={"144":1,"243":1};wantPickOpen([5],"Votre carte Mewtwo ne s’échangera que contre une des cartes choisies ici.",()=>{});wantPick.sel.add(144);wantPick.sel.add(243);wantPickRender()}
  if(scene==="unlock"){S.unlock={o:"baleine",t:Date.now()};view="shop";renderAll()}
}
</script></body></html>
